# QA Redis 설정. 컨테이너 안에서 모든 주소로 받고(호스트 포트는 127.0.0.1 만) ACL 로 인증
bind 0.0.0.0
protected-mode yes
port 6379
daemonize no
dir /data

# AOF 영속화
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 메모리 상한. TTL 이 있는 키부터 축출
maxmemory 512mb
maxmemory-policy volatile-ttl
timeout 0
tcp-keepalive 300

# 시작 스크립트가 만든 ACL 파일
aclfile /run/redis/users.acl
