# PVE 릴리스 서버 쪽 WireGuard 인터페이스(wg0). GCP 게이트웨이로 먼저 연결함
# 개인 키는 /etc/wireguard/wg0.key 에 따로 두고 기동 후 적용함(저장소에 키 없음)
[Interface]
Address = 10.99.0.2/30
PostUp = wg set %i private-key /etc/wireguard/wg0.key

# GCP 게이트웨이. NAT 뒤에서 터널을 유지하도록 25초마다 keepalive
[Peer]
PublicKey = NK+QHmv4L4H4nYokZd7AXNKMFwj+KyrUHkTKSitV/Wk=
Endpoint = 203.0.113.10:51820
AllowedIPs = 10.99.0.1/32
PersistentKeepalive = 25
