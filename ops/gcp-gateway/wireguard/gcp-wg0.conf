# GCP 게이트웨이 쪽 WireGuard 인터페이스(wg0). PVE 릴리스 서버와 /30 점대점 터널
# 개인 키는 /etc/wireguard/wg0.key 에 따로 두고 기동 후 적용함(저장소에 키 없음)
[Interface]
Address = 10.99.0.1/30
ListenPort = 51820
PostUp = wg set %i private-key /etc/wireguard/wg0.key

# PVE 릴리스 서버. 터널 주소와 릴리스 서버 LAN 주소(10.10.10.165)로 가는 트래픽만 허용
[Peer]
PublicKey = tzfFsEm3r0kW6n7u/QEFwXdQj/zgcu0PzooBBGquGmI=
AllowedIPs = 10.99.0.2/32, 10.10.10.165/32
