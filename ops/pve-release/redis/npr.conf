# NPR Redis is restricted to the local API host. PostgreSQL remains the
# source of truth; Redis is only for OTPs and short-lived idempotency keys.
bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 4096
timeout 0
tcp-keepalive 60
supervised systemd
daemonize no

dir /srv/redis
dbfilename dump.rdb
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes

maxmemory 1gb
maxmemory-policy volatile-ttl
maxclients 10000

save 900 1
save 300 10
save 60 10000

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
# Ubuntu's Redis build uses libc malloc, so active defragmentation is not
# available. Keep it disabled instead of making startup depend on jemalloc.
activedefrag no

aclfile /etc/redis/users.acl
