# 릴리스 VM Redis 설정. 로컬 API 호스트만 접속 가능
# 원장은 PostgreSQL. Redis 는 세션·OTP·스캐너 접속 표시·멱등 키처럼 TTL 이 있는 단기 상태만 둠
bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 4096
timeout 0
tcp-keepalive 60
supervised systemd
daemonize no

# 영속화. AOF(RDB 프리앰블 포함) + 주기 스냅숏
dir /srv/redis
dbfilename dump.rdb
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes

# 메모리 상한. TTL 이 있는 키부터 축출
maxmemory 1gb
maxmemory-policy volatile-ttl
maxclients 10000

save 900 1
save 300 10
save 60 10000

# 지연 해제
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
# Ubuntu Redis 빌드는 libc malloc 을 써서 active defragmentation 을 지원하지 않음
# jemalloc 에 기동이 의존하지 않도록 꺼 둠
activedefrag no

# ACL 사용자 파일. install-datastores.sh 가 생성
aclfile /etc/redis/users.acl
