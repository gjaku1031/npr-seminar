# NPR release VM: PostgreSQL 18, 24 GiB RAM, 12 vCPU, SSD-backed /srv.
# The NestJS API, Next.js web app, Redis, and workers share this VM, so PostgreSQL is capped
# conservatively rather than consuming the whole host.

listen_addresses = '127.0.0.1,::1'
port = 5432
max_connections = 100
superuser_reserved_connections = 3
password_encryption = 'scram-sha-256'

shared_buffers = '6GB'
effective_cache_size = '15GB'
work_mem = '16MB'
maintenance_work_mem = '1GB'
autovacuum_work_mem = '256MB'
huge_pages = try

min_wal_size = '1GB'
max_wal_size = '4GB'
checkpoint_completion_target = 0.9
wal_compression = on

random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 100
default_statistics_target = 200

max_worker_processes = 12
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

autovacuum_max_workers = 4
autovacuum_naptime = '30s'

shared_preload_libraries = 'pg_stat_statements'
compute_query_id = auto
pg_stat_statements.track = all
track_io_timing = on
track_wal_io_timing = on

idle_in_transaction_session_timeout = '60s'
lock_timeout = '10s'
deadlock_timeout = '1s'

log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_lock_waits = on
log_min_duration_statement = '500ms'
log_autovacuum_min_duration = '1s'

# PrismaPg serializes JavaScript Date values as offset-free UTC components.
# Keep every PostgreSQL session in UTC so timestamptz writes preserve the instant.
timezone = 'UTC'
