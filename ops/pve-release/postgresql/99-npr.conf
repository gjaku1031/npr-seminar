# 릴리스 VM PostgreSQL 18 설정. 24 GiB RAM, 12 vCPU, SSD 기반 /srv
# API·web·Redis·워커가 같은 VM 을 쓰므로 PostgreSQL 이 호스트 전체를 차지하지 않게 보수적으로 잡음

# 접속. 로컬 주소만 받고 SCRAM 비밀번호
listen_addresses = '127.0.0.1,::1'
port = 5432
max_connections = 100
superuser_reserved_connections = 3
password_encryption = 'scram-sha-256'

# 메모리
shared_buffers = '6GB'
effective_cache_size = '15GB'
work_mem = '16MB'
maintenance_work_mem = '1GB'
autovacuum_work_mem = '256MB'
huge_pages = try

# WAL·체크포인트
min_wal_size = '1GB'
max_wal_size = '4GB'
checkpoint_completion_target = 0.9
wal_compression = on

# SSD 기준 플래너·I/O
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 100
default_statistics_target = 200

# 병렬 처리
max_worker_processes = 12
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# autovacuum
autovacuum_max_workers = 4
autovacuum_naptime = '30s'

# 쿼리 통계
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = auto
pg_stat_statements.track = all
track_io_timing = on
track_wal_io_timing = on

# 장기 트랜잭션·잠금 대기 상한
idle_in_transaction_session_timeout = '60s'
lock_timeout = '10s'
deadlock_timeout = '1s'

# 로그
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_lock_waits = on
log_min_duration_statement = '500ms'
log_autovacuum_min_duration = '1s'

# PrismaPg 가 JavaScript Date 를 오프셋 없는 UTC 값으로 직렬화함
# 모든 세션을 UTC 로 고정해야 timestamptz 저장 시각이 어긋나지 않음
timezone = 'UTC'
