<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NPR iPad 스캐너 연결 디자인</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Pretendard, "Apple SD Gothic Neo", system-ui, sans-serif;
        color: #101828;
        background: #f7f8fa;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        min-height: 72px;
        padding: 16px 28px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(14px) saturate(1.4);
      }
      h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
      header p { margin: 4px 0 0; color: #667085; font-size: 14px; }
      .status {
        flex: none;
        border-radius: 999px;
        padding: 8px 12px;
        background: #e8f0ff;
        color: #1d4ed8;
        font-size: 13px;
        font-weight: 700;
      }
      main {
        display: grid;
        gap: 28px;
        max-width: 1540px;
        margin: 0 auto;
        padding: 28px;
      }
      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid rgba(15, 23, 42, 0.1);
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.07);
      }
      figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        font-size: 16px;
        font-weight: 800;
      }
      figcaption a {
        color: #1d4ed8;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
      img { display: block; width: 100%; height: auto; }
      footer {
        padding: 0 28px 32px;
        color: #667085;
        text-align: center;
        font-size: 13px;
      }
      @media (max-width: 720px) {
        header { align-items: flex-start; padding: 14px 18px; }
        h1 { font-size: 18px; }
        header p { font-size: 12px; }
        main { gap: 18px; padding: 18px; }
        footer { padding: 0 18px 24px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>iPad 스캐너 연결 디자인</h1>
        <p>아래 1, 2, 3안을 확인한 뒤 하나를 선택해 주세요.</p>
      </div>
      <span class="status">구현 전 승인 대기</span>
    </header>
    <main>
      <figure id="option-1">
        <figcaption><span>1</span><a href="option-1.png" target="_blank" rel="noreferrer">크게 보기</a></figcaption>
        <img src="option-1.png" alt="iPad 스캐너 연결 디자인 시안 1" />
      </figure>
      <figure id="option-2">
        <figcaption><span>2</span><a href="option-2.png" target="_blank" rel="noreferrer">크게 보기</a></figcaption>
        <img src="option-2.png" alt="iPad 스캐너 연결 디자인 시안 2" />
      </figure>
      <figure id="option-3">
        <figcaption><span>3</span><a href="option-3.png" target="_blank" rel="noreferrer">크게 보기</a></figcaption>
        <img src="option-3.png" alt="iPad 스캐너 연결 디자인 시안 3" />
      </figure>
    </main>
    <footer>선택된 시안만 실제 제품 화면으로 구현합니다.</footer>
  </body>
</html>
