        FAMILY_BOOKING: [STUDENT_SEARCH, FAMILY_BOOKING]
        BOOKING_MANAGE: [BOOKING_READ, BOOKING_MANAGE]

    BookingProofScope:
      type: string
      enum: [STUDENT_SEARCH, FAMILY_BOOKING, BOOKING_READ, BOOKING_MANAGE]

    OtpChallengeRequest:
      type: object
      required: [contact, purpose]
      properties:
        contact:
          type: string
          minLength: 8
          maxLength: 40
          writeOnly: true
          description: Parent contact normalized server-side to 8-15 digits; never logged.
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
        branch:
          $ref: '#/components/schemas/Branch'
          description: |
            Required selected campus for FAMILY_BOOKING. It is bound into the
            verified proof and controls both enrolled auto-linking and guest
            campus policy. Ignored for BOOKING_MANAGE, which derives its SMS
            route from owned booking snapshots.
      allOf:
        - if:
            properties:
              purpose:
                const: FAMILY_BOOKING
            required: [purpose]
          then:
            required: [branch]
      additionalProperties: false

    OtpChallengeAccepted:
      type: object
      required: [challengeId, expiresAt, retryAfterSeconds]
      properties:
