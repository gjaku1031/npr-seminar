    post:
      operationId: cancelPublicFamilyBooking
      tags: [Public family bookings]
      summary: Cancel a contact-owned reserved family booking
      description: |
        Proof contact must match. Cancellation is a status transition, updates
        the legacy transactional counters, revokes the active family QR, and appends events; no
