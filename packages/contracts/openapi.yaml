  /api/v1/admin/seminar-sessions/{sessionId}/operations-summary:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getAdminSessionOperationsSummary
      tags: [Admin family bookings]
      summary: Get POC family-booking operations counts for one session
      description: |
        Counts family booking aggregates, not participant rows. active is exactly
        RESERVED plus CHECKED_IN; checked-in is CHECKED_IN; unchecked is exactly
        RESERVED; cancelled is CANCELLED; and no-show is NO_SHOW. NO_SHOW is
        excluded from both active and unchecked. Guest-only family bookings are
        included because this is a session-level family operations summary.
        attendeeCount is an active parent-person count, with MOTHER/FATHER=1 and
