        - eventId
        - sequence
        - deviceId
        - type
        - branch
        - gateCode
        - seminarSessionId
        - actor
        - reason
        - metadata
        - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
        sequence:
          $ref: '#/components/schemas/AuditSequence'
        deviceId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/DeviceAuditEventType'
        branch:
          $ref: '#/components/schemas/Branch'
        gateCode:
          type: string
          maxLength: 100
        seminarSessionId:
          type: [string, 'null']
          format: uuid
        actor:
          $ref: '#/components/schemas/AuditActor'
        reason:
          type: [string, 'null']
