        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/public/family-bookings/{familyBookingId}:
    parameters:
      - $ref: '#/components/parameters/FamilyBookingId'
    get:
      operationId: getPublicFamilyBooking
      tags: [Public family bookings]
      summary: Read a family booking owned by the booking proof contact
      description: |
        A BOOKING_MANAGE proof contact digest must equal the booking contact
        digest, or a fragment-token/contact-read session must be bound to
        exactly this booking. Every path receives only the masked public DTO.
      security:
        - cookieAuth: []
        - bookingProof: []
      x-proof-scopes: [BOOKING_READ, BOOKING_MANAGE]
      responses:
        '200':
          description: Contact-owned masked family booking without raw QR material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMaskedFamilyBooking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updatePublicFamilyBooking
      tags: [Public family bookings]
      summary: Move a session or update attendance for a contact-owned booking
      description: |
        Proof contact must match the family contact. An optional
        seminarSessionId atomically moves the booking while retaining its active
        family QR. The automatically linked student set is immutable in public
        self-service and is rechecked against the proof digest under lock; a
        guest keeps its immutable guest branch.
        seatCount is recalculated only from attendanceParty. Duplicate,
        booking-window, and branch-scope constraints are checked in
        the same transaction. For an ALL session the immutable enrolled family
        remains bound to its original proof-selected campus and a guest may use
        its immutable campus; for a BRANCH session that campus must match the
        session branch. Public guest moves are rejected with
        GUEST_BOOKING_DISABLED when the target session has guest booking turned
        off. The same transaction appends UPDATED Google Sheets outbox deliveries
        without reading Sheet state.
      security:
        - bookingProof: []
      x-proof-scopes: [BOOKING_MANAGE]
      x-proof-consumption: same-transaction-on-success
      x-access-session-authorization: forbidden
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-csrf: true
      x-requires-same-origin: true
      x-google-sheets-outbox-event: UPDATED
      x-session-scope-authorization:
        ALL: immutable-proof-selected-campus-family
        BRANCH: immutable-family-campus-must-match-session-branch
      x-guest-session-scope-authorization:
        ALL: any-guest-branch
        BRANCH: guest-branch-must-match-session-branch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
