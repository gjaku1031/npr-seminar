        - BRANCH_VALIDATED
        - CONFLICT_DETECTED
        - RUN_READY_TO_PUBLISH
        - RUN_PUBLISHED
        - RUN_SUCCEEDED
        - RUN_FAILED
        - RUN_CANCELLED

