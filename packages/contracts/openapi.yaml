        same transaction appends one CANCELLED Google Sheets outbox delivery for
        every child active immediately before cancellation. The audit event is
        classified as SELF_SERVICE. The optional legacy reason remains accepted
        for public-client compatibility.
      security:
        - bookingProof: []
      x-proof-scopes: [BOOKING_MANAGE]
