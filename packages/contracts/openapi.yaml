      enum: [CREATED, UPDATED, CANCELLED, CHECKED_IN]

    GoogleSheetsReadiness:
      type: object
      required: [enabled, spreadsheetConfigured, credentialPathConfigured, adapterAvailable, outboundProjectionSupported, inboundSyncSupported, liveWritesSupported, blockReasonCode, mappings, pendingDeliveries, blockedDeliveries]
      properties:
        enabled:
          type: boolean
          description: Whether at least one mapping is effectively enabled and CLOSED in the worker-owned database state.
        spreadsheetConfigured:
          type: boolean
          description: Whether at least one explicit session-to-spreadsheet mapping exists.
        credentialPathConfigured:
          type: boolean
          description: Whether a recent worker validation proved usable isolated credentials without exposing their path or contents.
        adapterAvailable:
          type: boolean
          description: |
            Whether a recent credential-backed worker validation proved the
            isolated Sheets/Drive adapter available. The HTTP API derives this
            from non-secret mapping validation state and never receives Google
            credentials or instantiates the adapter.
        outboundProjectionSupported:
          type: boolean
          const: true
          description: The product supports durable PostgreSQL-to-Google-Sheets projection.
        inboundSyncSupported:
          type: boolean
          const: false
          description: Google Sheets never imports, mutates, or authorizes application state.
        liveWritesSupported:
          type: boolean
          description: |
            Current deployment readiness. True only after the dedicated service
            account, restricted workbook sharing, exact mapping, schema
            fingerprint, hidden idempotency markers, and QR-link policy gates
            pass and the worker validation is no older than 180 seconds. False
            means safely blocked or stale, not that outbound projection is
            absent from the product.
        blockReasonCode:
          type: [string, 'null']
          maxLength: 80
          description: Null only when liveWritesSupported is true.
        mappings:
          type: integer
          minimum: 0
        pendingDeliveries:
          type: integer
          minimum: 0
        blockedDeliveries:
          type: integer
          minimum: 0
      additionalProperties: false

