      tags: [Admin scanner devices]
      summary: Create a five-minute single-use scanner pairing code
      description: |
        The code is bound to a durable branch and gate assignment, expires after
        exactly five minutes, is stored only as a digest in Redis, and is consumed
        atomically on first successful claim. Raw code is returned only on fresh
        creation; an idempotency replay omits it. The displayed code is exactly
        six characters from 23456789ABCDEFGHJKLMNPQRSTUVWXYZ.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      x-secret-response-once: pairingCode
      x-mutation-kind: durable
