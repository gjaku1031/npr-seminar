      additionalProperties: false

    SmsAudience:
      type: string
      description: |
        Test bookings are excluded from every audience except TEST_ACCOUNTS, which selects
        only them. This split is about delivery, not counting: operators must be able to
        exercise the send path without reaching a real family, and a real send must never
        reach a test row. Statistics count test bookings normally.
      enum:
        - BOOKED_FAMILIES
        - RESERVED_FAMILIES
        - CHECKED_IN_FAMILIES
        - CANCELLED_FAMILIES
