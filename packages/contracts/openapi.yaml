openapi: 3.1.0
info:
  title: NPR Seminar NestJS API
  version: 1.0.0
  description: |
    Authoritative contract for the single NestJS backend used by the NPR Seminar
    web and scanner clients.

    ADMIN and SCANNER actors use a Redis-backed project session cookie. Every
    state-changing session request requires X-CSRF-Token and an allowed same-origin
    Origin. JSON is required except for the explicitly bounded ADMIN poster
    multipart upload. Public family access uses a separate,
    contact-bound X-Booking-Proof credential. QR tokens, booking proofs, OTPs,
    cookies, passwords, pairing codes, and full parent contact values are secrets and
    MUST be redacted from application, proxy, tracing, analytics, and audit logs.

    Historical resources are never hard-deleted. Booking, check-in, student,
    sync, circuit, and scanner-device histories are append-only and returned in
    stable chronological order. An SMS template that has no outbox usage history
    is configuration, not history, and may be hard-deleted after optimistic-lock
    and active-default checks; a used template is archived instead.
  x-contract-authority: packages/contracts/openapi.yaml
  x-backend-runtime: NestJS modular monolith
  x-sensitive-log-redaction:
    - Cookie
    - Set-Cookie
    - X-CSRF-Token
    - X-Booking-Proof
    - bookingProof
    - X-QR-Token
    - qrToken
    - pairingCode
    - oneTimeCode
    - contact
    - motherPhone
    - fatherPhone
    - password
  x-canonical-student-snapshot:
    snapshotDate: 2026-07-17
    classNameAdmissionPolicy:
      normalizeForDecision: NFKC_TRIM
      preserveAcceptedSourceValue: true
      allowBracketless: true
      allowOneTerminalScheduleSuffix: true
      weekdaySuffix: 1_TO_3_DISTINCT_WEEKDAYS_WITH_OPTIONAL_POSITIVE_SLOT_1_TO_99_NO_LEADING_ZERO
      latinSuffix: E_OR_e_WITH_POSITIVE_SLOT_1_TO_99_NO_LEADING_ZERO
      rejectAsterisk: true
      classifyUsingSuffixStrippedBase: true
    rawFetchedAssignmentCount: 10021
    bracketExcludedAssignmentCount: 6222
    includedAssignmentCount: 3799
    uniqueStudentCount: 3377
    multiAssignmentStudentCount: 371
    regularRepresentativeCount: 2986
    scienceAliasRepresentativeCount: 387
    multipleRegularAmbiguousCount: 1
    noClassAmbiguousCount: 3
    ambiguousStudentCount: 4
  x-current-seed-seminar-session:
    description: Current deployment seed; implementations must preserve the scope semantics below.
    scope: ALL
    branch: null
  x-google-sheets-projection:
    schemaVersion: 4
    authority: POSTGRESQL
    direction: POSTGRESQL_TO_GOOGLE_SHEETS_ONLY
    inboundSyncSupported: false
    delivery: DURABLE_TRANSACTIONAL_OUTBOX
    events: [CREATED, UPDATED, CANCELLED, CHECKED_IN]
    checkInProjection: FIRST_SUCCESSFUL_QR_CHECK_IN_ONLY
    activation: EXPLICIT_PREPARE_THEN_ENABLE
    sharingGate: DRIVE_METADATA_FAIL_CLOSED
    readinessValidationMaxAgeSeconds: 180
    reservationSheet:
      title: 예약명단
      sheetId: 1777564107
      businessRange: A:M
      reservedBlankRange: N:AC
      sourceStudentNoDisplayColumn: B
      rowIdentity: FAMILY_BOOKING_STUDENT_ID_ONLY
      valueInputMode: RAW
      postWriteExactVerification: true
    familySummarySheet:
      title: 예약집계
      sheetId: 202607180
      businessRange: A:M
      reservedBlankRange: N:Y
      valueInputMode: RAW
      postWriteExactVerification: true
    bookingLogSheet:
      title: 로그
      sheetId: 1415280656
      businessRange: A:M
      reservedBlankRange: N:Y
      valueInputMode: RAW
      appendOnly: true
      postWriteExactVerification: true
    visibleHeaders:
      reservationRosterAtoM: [예약일시, 학번, 캠퍼스, 학생명, 수학반, 과학반, 학교, 학년, 담임, '학부모HP (모)', '학부모HP (부)', 예약상태, 로그]
      familySummaryAtoM: [예약일시, 가족예약ID, 캠퍼스, 학생명 목록, 참석자, 예약건수, 예약인원, 입장건수, 입장인원, 상태, 예약경로, 체크인시각, 최신로그]
      bookingLogAtoM: [이벤트일시, 이벤트, 가족예약ID, 캠퍼스, 학생수, 학생명, 참석자, 예약인원, 입장인원, 예약상태, 예약경로, 처리자, 로그]
    campusValues:
      CAMPUS_A: A
      CAMPUS_B: B
      CAMPUS_C: C
    reservationStateValues:
      reservedMother: 예약 (모)
      reservedFather: 예약 (부)
      reservedBoth: 예약 (모/부)
      cancelled: 예약취소
      checkedIn: 입장 완료
      noShow: 미참석
    technicalMarkerColumns:
      reservationRoster:
        sheetTitle: 예약명단
        column: AD
        header: __NPR_FAMILY_BOOKING_STUDENT_ID
        value: familyBookingStudentId
        hidden: true
        protected: true
        bootstrap: INITIALIZE_IF_BLANK_IDEMPOTENTLY
        conflictingHeader: BLOCK_WITH_SCHEMA_DRIFT
      familySummary:
        sheetTitle: 예약집계
        column: Z
        header: __NPR_FAMILY_BOOKING_ID
        value: familyBookingId
        hidden: true
        protected: true
        bootstrap: INITIALIZE_IF_BLANK_IDEMPOTENTLY
        conflictingHeader: BLOCK_WITH_SCHEMA_DRIFT
      bookingLog:
        sheetTitle: 로그
        column: Z
        header: __NPR_BOOKING_EVENT_ID
        value: eventId
        hidden: true
        protected: true
        bootstrap: INITIALIZE_IF_BLANK_IDEMPOTENTLY
        conflictingHeader: BLOCK_WITH_SCHEMA_DRIFT
    markerUniqueness:
      reservationRoster: EXACTLY_ONE_PER_FAMILY_BOOKING_STUDENT_ID
      familySummary: EXACTLY_ONE_PER_FAMILY_BOOKING_ID
      bookingLog: EXACTLY_ONE_PER_BOOKING_EVENT_ID
      staleDuplicatePolicy: KEEP_ONE_MATCHING_PROJECTION_AND_CLEAR_OTHER_TECHNICAL_MARKERS
    description: |
      PostgreSQL is the sole source of truth. A committed family-booking create,
      update, cancellation, or first successful QR check-in atomically creates a
      per-child durable outbox delivery. Google Sheets is an asynchronous
      projection only: Sheet edits never create or change application state and
      no Sheet-to-application endpoint, poller, or import worker is permitted.
      Visible 예약명단 A:M headers are the strict live-workbook schema; N:AC must
      remain blank. 수학반 and 과학반 preserve every current representative
      assignment name, including valid terminal timetable suffixes. Blank AD1/Z1
      technical headers may be initialized, hidden, and protected for the service
      account and Drive owner only by the explicit prepare command; normal dispatch
      never bootstraps schema. Reservation rows are located only by
      familyBookingStudentId, never by the visible source student number. Public/link,
      domain-wide, or group sharing, a conflicting nonblank header, stale worker
      validation, or other schema drift blocks live writes.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Same-origin reverse proxy; browsers do not call a cross-origin API.
tags:
  - name: Auth
  - name: Public OTP
  - name: Public seminar sessions
  - name: Public students
  - name: Public family bookings
  - name: Public poster
  - name: Public QR pass
  - name: Admin seminars
  - name: Admin students
  - name: Admin student sync
  - name: Admin family bookings
  - name: Admin poster
  - name: Admin check-in audit
  - name: Admin scanner devices
  - name: Admin SMS
  - name: Admin Google Sheets
  - name: Scanner pairing
  - name: Scanner
  - name: Scanner check-in

paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [Auth]
      summary: Establish a pre-auth session and obtain a CSRF token
      description: |
        Creates or reuses the project pre-auth session cookie. The token is
        required for login and public scanner pairing claim, and a fresh token is
        required after session identity regeneration. Cookie and token values
        MUST NOT be logged.
      security: []
      responses:
        '200':
          description: CSRF token bound to the project pre-auth or authenticated session
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ProjectSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/login:
    post:
      operationId: loginProjectSession
      tags: [Auth]
      summary: Authenticate an administrator and regenerate the project session
      description: |
        Rate limited by IP and account digest. A generic error hides account
        existence. Success and failure are audited without credentials. The
        pre-auth session ID is regenerated on success.
      security: []
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-csrf: true
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated ADMIN session
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ProjectSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentActor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/logout:
    post:
      operationId: logoutProjectSession
      tags: [Auth]
      summary: Destroy the Redis-backed project session
      description: Invalidates the server-side session and expires the cookie.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN, SCANNER]
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-csrf: true
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '204':
          description: Session invalidated; a replay is also successful
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ExpiredProjectSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/me:
    get:
      operationId: getCurrentActor
      tags: [Auth]
      summary: Get the minimal authenticated ADMIN or SCANNER actor
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN, SCANNER]
      responses:
        '200':
          description: Current session actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentActor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/public/poster:
    get:
      operationId: getCurrentPublicPoster
      tags: [Public poster]
      summary: Get the current poster descriptor without caching stale metadata
      description: |
        Returns poster=null when an administrator has not uploaded a poster yet.
        Descriptor responses are no-store; clients cache only the versioned asset URL.
      security: []
      responses:
        '200':
          description: Current immutable asset descriptor, or an explicit empty state
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPosterResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/public/poster/image/{version}:
    parameters:
      - $ref: '#/components/parameters/PosterVersion'
    get:
      operationId: getVersionedPublicPosterAsset
      tags: [Public poster]
      summary: Fetch one content-addressed immutable poster asset
      description: |
        The version is the lowercase SHA-256 content hash. The server resolves
        the trusted media type from its immutable asset metadata. Previously
        active versions remain readable so immutable caches never change meaning.
        If-None-Match takes precedence over If-Modified-Since.
      security: []
      x-binary-response-media-type: image/*
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            maxLength: 256
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Exact PNG, JPEG, or WebP bytes for this immutable version
          headers:
            ETag:
              schema:
                type: string
              description: Strong SHA-256 entity tag.
            Last-Modified:
              schema:
                type: string
              description: Immutable asset filesystem timestamp in HTTP-date form.
            Cache-Control:
              schema:
                type: string
                const: public, max-age=31536000, immutable
          content:
            image/*:
              schema:
                type: string
                format: binary
        '304':
          description: Conditional request matched the immutable asset
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/admin/poster:
    put:
      operationId: replaceCurrentPoster
      tags: [Admin poster]
      summary: Atomically replace the single active poster
      description: |
        Durable multipart upload of exactly one poster field. The server ignores
        the untrusted client filename, enforces a 10 MiB hard limit, accepts only
        PNG, JPEG, or WebP, and requires the declared media type to match raster
        magic bytes. It writes a content-addressed immutable asset before
        atomically replacing the current manifest. File-backed idempotency records
        replay the original descriptor and reject key reuse with different bytes.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-csrf: true
      x-requires-same-origin: true
      x-request-media-type: multipart/form-data
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [poster]
              properties:
                poster:
                  type: string
                  format: binary
              additionalProperties: false
            encoding:
              poster:
                contentType: image/png, image/jpeg, image/webp
      responses:
        '200':
          description: New active descriptor or an idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosterUploadResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/public/otp/challenges:
    post:
      operationId: requestOtpChallenge
      tags: [Public OTP]
      summary: Request an SMS OTP challenge
      description: |
        Creates a five-minute OTP challenge and enqueues delivery through the
        production SMS outbox. The normalized parent contact, raw OTP, and provider
        credentials are secrets and MUST NOT be logged. Test fixtures and bypass
        endpoints are never part of this contract.
      security: []
      x-implementation-status: implemented
      x-sms-delivery: outbox
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-csrf: true
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpChallengeRequest'
      responses:
        '201':
          description: Challenge created and queued for SMS delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OtpProviderUnavailable'

  /api/v1/public/otp/challenges/{challengeId}/verify:
    parameters:
      - $ref: '#/components/parameters/ChallengeId'
    post:
      operationId: verifyOtpChallenge
      tags: [Public OTP]
      summary: Verify an SMS OTP and issue a single-use opaque booking proof
      description: |
        Atomically verifies the challenge and, only on a fresh idempotency result,
        returns a 256-bit base64url bearer proof bound to the normalized contact
        digest, purpose-derived scopes, and ten-minute expiry. PostgreSQL stores
        only SHA-256(proof), never the raw proof. FAMILY_BOOKING proofs permit
        repeated authorized student-search reads until atomically consumed by one
        booking creation. BOOKING_MANAGE proofs permit repeated owned booking
        reads until atomically consumed by the first update or cancellation.
        Consumed or expired proofs cannot be reused. An idempotency replay is
        deliberately secret-free and requires a new challenge if the caller lost
        the fresh response.
      security: []
      x-implementation-status: implemented
      x-secret-response-once: bookingProof
      x-proof-storage: sha256-digest-only
      x-proof-consumption:
        FAMILY_BOOKING: read-students-until-consumed-by-create
        BOOKING_MANAGE: read-booking-until-consumed-by-update-or-cancel
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-csrf: true
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Fresh raw booking proof or secret-free idempotency replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpProofIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OtpProviderUnavailable'

  /api/v1/public/seminar-sessions:
    get:
      operationId: listPublicSeminarSessions
      tags: [Public seminar sessions]
      summary: List sessions currently available to the public booking flow
      description: |
        Returns only published seminars and sessions in their public booking
        window. ALL sessions have branch=null and accept a family from any one
        proof-selected campus. BRANCH sessions have a concrete branch and the
        proof-selected campus must match it. Only sessions whose parent seminar
        is PUBLISHED are bookable even if a session UUID is guessed directly.
      security: []
      parameters:
        - $ref: '#/components/parameters/BranchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Booking-eligible sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSeminarSessionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/public/students:
    get:
      operationId: searchAuthorizedStudents
      tags: [Public students]
      summary: Search students authorized by the contact-bound booking proof
      description: |
        The server derives the parent-contact digest only from X-Booking-Proof
        and returns active students in the campus bound into that proof whose
        mother or father contact digest exactly matches it. The optional branch
        query is compatibility-only and, when present, must equal the proof-bound
        campus. A caller cannot broaden this set with query parameters or a
        guessed student ID.
      security:
        - bookingProof: []
      x-proof-scopes: [STUDENT_SEARCH, FAMILY_BOOKING]
      parameters:
        - name: query
          in: query
          required: false
          description: Optional name or source student number prefix inside the proof-authorized set.
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - $ref: '#/components/parameters/BranchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Proof-authorized students only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStudentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/public/family-bookings:
    get:
      operationId: listOwnedFamilyBookings
      tags: [Public family bookings]
      summary: List every family booking owned by the verified parent contact
      description: |
        X-Booking-Proof supplies the authoritative parent-contact digest. The
        response contains only family bookings with the same digest, ordered
        newest first as PublicMaskedFamilyBooking objects. The endpoint
        deliberately accepts no contact or search query that could broaden the
        proof-owned set, and never returns full participant or contact PII.
      security:
        - bookingProof: []
      x-proof-scopes: [BOOKING_READ, BOOKING_MANAGE]
      responses:
        '200':
          description: Contact-owned family bookings, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMaskedFamilyBookingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createPublicFamilyBooking
      tags: [Public family bookings]
      summary: Atomically create one contact-owned family booking
      description: |
        X-Booking-Proof supplies the authoritative parent-contact digest. An
        ENROLLED request accepts no student IDs: the server atomically auto-links
        every active student whose mother or father contact digest matches in the
        campus bound into the proof. If no match exists in that campus it returns
        ENROLLED_STUDENT_NOT_FOUND. A GUEST request is rejected with
        ENROLLED_CONTACT_MUST_USE_ENROLLED_FLOW when that contact matches an
        active student in any campus, and with GUEST_BOOKING_DISABLED when the
        selected session has not enabled guest booking. A valid GUEST request
        creates exactly one required name/campus/school/grade snapshot. The
        client submits attendanceParty only; seatCount is
        server-derived as MOTHER=1, FATHER=1, BOTH=2 and never scales with child
        count.

        A newly committed aggregate returns exactly one family-level raw qrToken
        at the response top level. An idempotency replay returns the same booking
        without qrToken. The raw QR is not stored in plaintext: it is recoverable
        only from AEAD ciphertext and verified against its SHA-256 digest. The raw
        booking-access token is never stored.
        No child has a QR, status, or seat field. A BRANCH session must match the
        proof-selected campus. This scope rule is revalidated while locks are held. The
        same PostgreSQL transaction appends one CREATED Google Sheets outbox
        delivery per booking child; Google availability never controls booking
        commit success.
      security:
        - bookingProof: []
      x-proof-scopes: [FAMILY_BOOKING]
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-same-origin: true
      x-secret-response-once: qrToken
      x-google-sheets-outbox-event: CREATED
      x-session-scope-authorization:
        ALL: all-auto-linked-students-belong-to-proof-selected-campus
        BRANCH: proof-selected-campus-must-match-session-branch
      x-guest-session-scope-authorization:
