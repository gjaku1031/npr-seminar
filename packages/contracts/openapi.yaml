    StudentClassificationSummary:
      type: object
      description: |
        Except for reviewRequiredStudentCount, every value is aggregated from
        sourceActive=true students in the request branch and unitGroup, or their
        ALL defaults. Query, teacher, resolution, categorizedOnly, pagination,
        and every other list filter are intentionally ignored so the
        student-status header remains stable while browsing.
        reviewRequiredStudentCount is aggregated from sourceActive=true students
        by branch only and ignores unitGroup and all other filters.
        items and page.totalItems continue to apply every list filter.
        multiAssignmentStudentCount is independent from representative
        classification. mathRegularStudentCount and scienceRegularStudentCount
        count unique students with at least one eligible active assignment in
        each category; a student enrolled in both categories contributes to both.
        eligibleUniqueStudentCount is the classified current-enrollment UI total.
        mathStudentCount counts every student with math, including students with
        both math and science. scienceOnlyStudentCount counts science students
        without math. These fields and reviewRequiredStudentCount are the
        assignment-projection summary; all other fields remain for compatibility.
      required:
        - uniqueStudentCount
        - multiAssignmentStudentCount
        - regularRepresentativeCount
        - scienceAliasRepresentativeCount
        - multipleRegularAmbiguousCount
        - noClassAmbiguousCount
        - ambiguousStudentCount
        - mathRegularStudentCount
        - scienceRegularStudentCount
        - eligibleUniqueStudentCount
        - mathStudentCount
        - scienceOnlyStudentCount
        - reviewRequiredStudentCount
      properties:
        uniqueStudentCount:
          type: integer
          minimum: 0
        multiAssignmentStudentCount:
          type: integer
          minimum: 0
        regularRepresentativeCount:
          type: integer
          minimum: 0
        scienceAliasRepresentativeCount:
          type: integer
          minimum: 0
        multipleRegularAmbiguousCount:
          type: integer
          minimum: 0
        noClassAmbiguousCount:
          type: integer
          minimum: 0
        ambiguousStudentCount:
          type: integer
          minimum: 0
        mathRegularStudentCount:
          type: integer
          minimum: 0
        scienceRegularStudentCount:
          type: integer
          minimum: 0
        eligibleUniqueStudentCount:
          type: integer
          minimum: 0
          description: Classified current-enrollment UI total; counts each sourceActive=true student with at least one recognizable active math or science class once, within the selected branch and unitGroup.
        mathStudentCount:
          type: integer
          minimum: 0
          description: Students with any recognizable active math class, including students enrolled in both math and science, within the selected branch and unitGroup.
        scienceOnlyStudentCount:
          type: integer
          minimum: 0
          description: Students with recognizable active science and no recognizable active math class, within the selected branch and unitGroup.
        reviewRequiredStudentCount:
          type: integer
          minimum: 0
          description: Active students requiring classification review in the selected branch. This count is branch-only and ignores unitGroup, query, teacherName, sourceActive, categorizedOnly, resolution, unitName, representativeClass, grade, page, pageSize, and all other list filters.
      additionalProperties: false

    AdminStudentFacets:
      type: object
      description: |
        Filter options computed before pagination. teachers applies every current
        admin-student filter except teacherName, page, and pageSize, so selecting
        a teacher filters the result without collapsing the available options.
        Values are distinct NFKC-normalized primary names taken before the first
        comma and returned in stable ascending order, only for students with at
        least one active projected math class. Science assignment instructors are
        traceability-only and science-only students are excluded.
      required: [teachers]
      properties:
        teachers:
          type: array
          uniqueItems: true
          x-homeroom-applicability: MATH_REGULAR_CLASS_ONLY
          x-science-only-policy: EXCLUDED
          items:
