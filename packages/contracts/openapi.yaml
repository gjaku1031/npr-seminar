    get:
      operationId: exportAdminSessionRosterXlsx
      tags: [Admin family bookings]
      summary: Export every reservation participant matching the current roster filters
      description: |
        ADMIN-only XLSX export of the same booked-only roster read model as
        getAdminSessionRoster. branch is the campus filter. unitGroup,
        teacherName, query, and exact contact-last-four matching have identical
        semantics to the JSON roster. The export is intentionally unpaginated:
        every matching row is written regardless of the UI's current page or
        pageSize. The richer operational workbook has separate campus, math
        class, science classes, unit, full mother contact, full father contact,
        reservation status, check-in status and timestamp, and latest-event
        columns. Every user-controlled text cell is neutralized against
        spreadsheet formula execution.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      x-pagination: none
      x-formula-injection-neutralization: leading-formula-trigger-apostrophe
      x-binary-response-media-type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      parameters:
        - $ref: '#/components/parameters/BranchQuery'
        - name: unitGroup
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RosterUnitGroup'
        - name: teacherName
          in: query
          required: false
          description: Exact canonical math-homeroom teacher (the first trimmed comma-separated student-row value). Science-only and other no-math rows never match.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: query
          in: query
          required: false
          description: Student name, school, source number, or exact contact last four.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Unpaginated filtered reservation roster workbook
          headers:
            Content-Disposition:
              description: Attachment filename ending in .xlsx.
              schema:
                type: string
                pattern: '^attachment; .+\.xlsx.*$'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
