          description: |
            QR rehearsal booking. Counted in statistics and roster monitoring like any other
            booking, so operators can confirm the aggregates actually move before the event;
            the rehearsal booking is cancelled once that check is done. Still excluded from
            the Google Sheets projection and from every SMS audience except TEST_ACCOUNTS —
            those leave the system, and a rehearsal must not reach a real sheet or phone.
            Pinned to the top of the roster and the only booking whose entry may be rolled back.
          type: boolean
        checkedInAt:
          type: [string, 'null']
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
          minimum: 1
      additionalProperties: false

    SessionRosterOperationalEvent:
      type: object
      description: Latest booking event after excluding QR_ISSUED, QR_ROTATED, and QR_REVOKED.
      required: [eventId, type, actorType, label, occurredAt]
      properties:
        eventId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/RosterOperationalEventType'
        actorType:
          $ref: '#/components/schemas/AuditActorType'
        label:
          type: string
          enum: [웹앱 예약, 수동 예약, 웹앱 예약 취소, 수동 예약 취소, 입장 완료, 미참석 처리]
        occurredAt:
          type: string
          format: date-time
      additionalProperties: false

    SessionRosterBookingHistoryReference:
      type: object
      description: Safe pointer to the existing per-family append-only events endpoint.
      required: [familyBookingId, status, current, eventsPath, createdAt, cancelledAt]
      properties:
        familyBookingId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/FamilyBookingStatus'
        current:
          type: boolean
          description: True for the aggregate selected into booking (active preferred, otherwise latest terminal).
        eventsPath:
          type: string
          pattern: '^/api/v1/admin/family-bookings/[0-9a-f-]{36}/events$'
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
      additionalProperties: false

    SessionRosterRow:
      type: object
      description: |
        One booking-linked enrolled student or one deduplicated session guest intent.
        Unbooked canonical students are never returned. For an enrolled sibling family
        the booking projection is intentionally repeated on each student's row and
        shares the same familyBookingId. Guest rows use the oldest
        familyBookingStudentId as rosterEntryId. Rebookings with the same contact
        digest, NFKC-normalized case-folded name, and branch are one guest identity;
        the selected current/latest child is exposed separately as
        familyBookingStudentId and all aggregates remain in bookingHistory.
        Consequently, two real guests sharing that exact private identity key are
        intentionally treated as one roster intent.
      required:
        - rosterEntryId
        - participantType
        - studentId
        - familyBookingStudentId
        - sourceStudentNo
        - name
        - branch
        - representativeClassName
        - mathClassName
        - scienceClassNames
        - schoolName
        - grade
        - unitName
        - primaryTeacher
        - motherPhone
        - fatherPhone
        - guestContact
        - booking
        - latestOperationalEvent
        - bookingHistory
      properties:
        rosterEntryId:
          type: string
          format: uuid
          description: Stable studentId for ENROLLED; the oldest matching guest child ID for GUEST.
        participantType:
          $ref: '#/components/schemas/BookingParticipantType'
        studentId:
          type: [string, 'null']
          format: uuid
        familyBookingStudentId:
          type: string
          format: uuid
          description: Selected active/latest booking child ID.
        sourceStudentNo:
          type: string
          maxLength: 160
        name:
          type: string
          maxLength: 300
        branch:
          $ref: '#/components/schemas/Branch'
        representativeClassName:
          type: string
          maxLength: 300
        mathClassName:
          type: [string, 'null']
          maxLength: 300
          description: Canonical active math-class projection; null for GUEST and science-only enrolled students.
        scienceClassNames:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 300
          description: Sorted canonical active science-class projections; empty for GUEST or when none exist.
        schoolName:
          type: [string, 'null']
          maxLength: 300
        grade:
          type: [string, 'null']
          maxLength: 100
        unitName:
          type: [string, 'null']
          enum: [과학, 예고1, 특목, 예중1, 초등, 고등, 중등1, 중등2, 중등3, null]
        primaryTeacher:
          type: [string, 'null']
          maxLength: 300
          description: Normalized student-row math homeroom teacher. Null for GUEST, science-only, and every enrolled row without an active projected math class; assignment instructors are never fallbacks.
          x-homeroom-applicability: MATH_REGULAR_CLASS_ONLY
          x-science-only-policy: RETURN_NULL
          x-assignment-teacher-fallback: forbidden
        motherPhone:
          type: [string, 'null']
          pattern: '^[0-9]{8,15}$'
          description: ADMIN-only normalized full mother contact for ENROLLED; null for GUEST.
        fatherPhone:
          type: [string, 'null']
          pattern: '^[0-9]{8,15}$'
          description: ADMIN-only normalized full father contact for ENROLLED; null for GUEST.
        guestContact:
          type: [string, 'null']
          pattern: '^[0-9]{8,15}$'
          description: ADMIN-only normalized booking contact for GUEST; null for ENROLLED.
        booking:
          $ref: '#/components/schemas/SessionRosterBookingProjection'
        latestOperationalEvent:
          oneOf:
            - $ref: '#/components/schemas/SessionRosterOperationalEvent'
            - type: 'null'
        bookingHistory:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SessionRosterBookingHistoryReference'
      additionalProperties: false

    SessionRosterFacets:
      type: object
      required: [teachers, unmatchedUnitCount]
      properties:
        teachers:
          type: array
          uniqueItems: true
          x-homeroom-applicability: MATH_REGULAR_CLASS_ONLY
          x-science-only-policy: EXCLUDED
          items:
            type: string
            minLength: 1
            maxLength: 300
          description: Canonical student-row math homeroom teachers among enrolled booking participants for the selected session scope and branch, independent of unit/query filters. Science-only and other no-math rows are excluded.
        unmatchedUnitCount:
          type: integer
          minimum: 0
          description: Enrolled booking participants whose class prefix matches no canonical unit rule.
      additionalProperties: false

    SessionRosterPage:
      type: object
      required: [items, page, facets, monitoring]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SessionRosterRow'
        page:
          $ref: '#/components/schemas/PageMeta'
        facets:
          $ref: '#/components/schemas/SessionRosterFacets'
        monitoring:
          $ref: '#/components/schemas/AttendanceMonitoring'
      additionalProperties: false

    FamilyBookingStudentSnapshot:
      type: object
      description: |
        Enrolled-student or guest participant snapshot at booking time. A GUEST
        has studentId=null and one synthetic sourceStudentNo beginning with
        `비재원-`; ENROLLED has a concrete studentId. It deliberately has no QR,
        booking status, check-in status, or seat count; those belong to the
        family aggregate.
      required:
        - familyBookingStudentId
        - participantType
        - studentId
        - sourceStudentNo
        - name
        - branch
        - representativeClassName
        - schoolName
        - grade
        - unitName
        - teacherName
      properties:
        familyBookingStudentId:
          type: string
          format: uuid
        participantType:
          $ref: '#/components/schemas/BookingParticipantType'
        studentId:
          type: [string, 'null']
          format: uuid
        sourceStudentNo:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 100
        branch:
          $ref: '#/components/schemas/Branch'
        representativeClassName:
          type: [string, 'null']
          maxLength: 200
        schoolName:
          type: [string, 'null']
          maxLength: 200
        grade:
          type: [string, 'null']
          maxLength: 40
        unitName:
          type: [string, 'null']
          maxLength: 100
        teacherName:
          type: [string, 'null']
          maxLength: 100
          description: |
            User-facing math homeroom teacher. When current linked-student
            classification evidence is available, this is the canonical first
            student-row teacher only if at least one active projected math
            representative assignment exists; science-only and other no-math
            students return null. A canonical historic booking snapshot is used
            only when current classification evidence is unavailable. Assignment
            teacher names are traceability-only and are never fallbacks.
          x-homeroom-applicability: MATH_REGULAR_CLASS_ONLY
          x-science-only-policy: RETURN_NULL
          x-no-math-policy: RETURN_NULL
          x-assignment-teacher-fallback: forbidden
      allOf:
        - if:
            properties:
              participantType:
                const: ENROLLED
            required: [participantType]
          then:
            properties:
              studentId:
                type: string
                format: uuid
        - if:
            properties:
              participantType:
                const: GUEST
            required: [participantType]
          then:
            properties:
              studentId:
                type: 'null'
      additionalProperties: false

    FamilyBooking:
      type: object
      description: |
        One family aggregate with one family-level seat count and QR lifecycle.
        Full contact is returned to authenticated ADMIN operations and the
        existing OTP-authorized fresh-create result. Public lookup, read,
        update, and cancellation use PublicMaskedFamilyBooking instead. Full
        contact is forbidden from logs and audit metadata.
      required:
        - familyBookingId
        - seminarSessionId
        - contact
        - attendanceParty
        - bookingSource
        - seatCount
        - status
        - students
        - qrStatus
        - qrVersion
        - version
        - createdAt
        - updatedAt
        - checkedInAt
        - attendedCount
        - isTest
        - cancelledAt
      properties:
        familyBookingId:
          type: string
          format: uuid
        seminarSessionId:
          type: string
          format: uuid
        contact:
          type: string
          minLength: 8
          maxLength: 15
          pattern: '^[0-9]{8,15}$'
        attendanceParty:
          $ref: '#/components/schemas/AttendanceParty'
        bookingSource:
          $ref: '#/components/schemas/BookingSource'
        seatCount:
          type: integer
          enum: [1, 2]
          readOnly: true
          description: Server-derived family total; never accepted from booking clients.
        status:
          $ref: '#/components/schemas/FamilyBookingStatus'
        students:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/FamilyBookingStudentSnapshot'
        qrStatus:
          $ref: '#/components/schemas/QrCredentialStatus'
        qrVersion:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        checkedInAt:
          type: [string, 'null']
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
        attendedCount:
          description: |
            How many parents actually entered, decided at the gate. Null until the booking
            checks in. Never exceeds seatCount and may be lower when a two-parent booking
            arrives with one parent.
          type: [integer, 'null']
          minimum: 1
          maximum: 20
          readOnly: true
        isTest:
          description: |
            QR rehearsal booking. Counted in statistics like any other booking; excluded from
            the Google Sheets projection and from every SMS audience except TEST_ACCOUNTS.
          type: boolean
          readOnly: true
      additionalProperties: false

    PublicMaskedFamilyBookingParticipant:
      type: object
      required: [participantType, maskedName, branch]
      properties:
        participantType:
          $ref: '#/components/schemas/BookingParticipantType'
        maskedName:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC name with every non-edge character hidden; one- and two-character names remain non-reversible.
        branch:
          $ref: '#/components/schemas/Branch'
      additionalProperties: false

    PublicMaskedFamilyBooking:
      type: object
      description: |
        Public aggregate deliberately limited to masked contact and participant
        identity. Full contact/name, student number, school, class, teacher,
        qrToken, qrVersion, and child identifiers are forbidden.
      required:
        - familyBookingId
        - seminarSessionId
        - maskedContact
        - attendanceParty
        - bookingSource
        - seatCount
        - status
        - participants
        - qrStatus
        - version
        - createdAt
        - updatedAt
        - checkedInAt
        - cancelledAt
      properties:
        familyBookingId:
          type: string
          format: uuid
        seminarSessionId:
          type: string
          format: uuid
        maskedContact:
          type: string
          pattern: '^[0-9]{3}-\*{4}-[0-9]{4}$'
        attendanceParty:
          $ref: '#/components/schemas/AttendanceParty'
        bookingSource:
          $ref: '#/components/schemas/BookingSource'
        seatCount:
          type: integer
          enum: [1, 2]
          readOnly: true
        status:
          $ref: '#/components/schemas/FamilyBookingStatus'
        participants:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/PublicMaskedFamilyBookingParticipant'
        qrStatus:
          $ref: '#/components/schemas/QrCredentialStatus'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        checkedInAt:
          type: [string, 'null']
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
      additionalProperties: false

    PublicMaskedFamilyBookingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PublicMaskedFamilyBooking'
      additionalProperties: false

    PublicFamilyBookingLookupRequest:
      type: object
      required: [contact]
      properties:
        contact:
          type: string
          minLength: 8
          maxLength: 40
          writeOnly: true
          description: Full phone normalized server-side; suffix-only matching is forbidden.
      additionalProperties: false

    PublicFamilyBookingReadSessionRequest:
      type: object
      required: [contact]
      properties:
        contact:
          type: string
          minLength: 8
          maxLength: 40
          writeOnly: true
          description: Full parent phone normalized server-side and checked against exactly the selected booking.
      additionalProperties: false

    BookingAccessExchangeRequest:
      type: object
      required: [accessToken, contact]
      properties:
        accessToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: Raw token read client-side from the URL fragment and submitted only in this body.
        contact:
          type: string
          minLength: 8
          maxLength: 40
          writeOnly: true
          description: Full parent phone normalized server-side; suffix-only matching is forbidden.
      additionalProperties: false

    BookingAccessExchangeResult:
      type: object
      required: [familyBookingId, expiresAt, csrfToken]
      properties:
        familyBookingId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: Fixed 30-minute booking-scoped management session expiry.
        csrfToken:
          type: string
          minLength: 43
          maxLength: 43
          description: Fresh token returned after session fixation protection regenerates the browser session.
      additionalProperties: false

    PublicFamilyBookingCreateRequest:
      type: object
      required: [participantType, seminarSessionId, attendanceParty]
      properties:
        participantType:
          $ref: '#/components/schemas/BookingParticipantType'
        seminarSessionId:
          type: string
          format: uuid
        attendanceParty:
          $ref: '#/components/schemas/AttendanceParty'
        guest:
          $ref: '#/components/schemas/PublicGuestParticipantInput'
      oneOf:
        - title: Enrolled family booking
          properties:
            participantType:
              const: ENROLLED
          not:
            required: [guest]
        - title: Guest family booking
          properties:
            participantType:
              const: GUEST
          required: [guest]
      discriminator:
        propertyName: participantType
      additionalProperties: false

    PublicGuestParticipantInput:
      type: object
      required: [name, branch, schoolName, grade]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        branch:
          $ref: '#/components/schemas/Branch'
        schoolName:
          type: string
          minLength: 1
          maxLength: 200
        grade:
          type: string
          enum: [초1, 초2, 초3, 초4, 초5, 초6, 중1, 중2, 중3, 고1, 고2, 고3]
      additionalProperties: false

    PublicFamilyBookingUpdateRequest:
      type: object
      required: [expectedVersion]
      minProperties: 2
      properties:
        seminarSessionId:
          type: string
          format: uuid
          description: Optional target session for an atomic move; the active family QR is retained.
        attendanceParty:
          $ref: '#/components/schemas/AttendanceParty'
        expectedVersion:
          type: integer
          minimum: 1
      additionalProperties: false

    OwnedFamilyBookingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicMaskedFamilyBooking'
      additionalProperties: false

    PublicCancellationRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: [string, 'null']
          maxLength: 500
          deprecated: true
          description: Compatibility-only public audit note; it does not change the SELF_SERVICE cancellation classification.
      additionalProperties: false

    AdminFamilyBookingCreateRequest:
      type: object
      required: [participantType, seminarSessionId, contact, attendanceParty, bookingSource]
      properties:
        participantType:
          $ref: '#/components/schemas/BookingParticipantType'
        seminarSessionId:
          type: string
          format: uuid
        contact:
          type: string
          minLength: 8
          maxLength: 40
          writeOnly: true
          description: Must digest-match every selected student's stored mother or father contact.
        attendanceParty:
          $ref: '#/components/schemas/AttendanceParty'
        bookingSource:
          $ref: '#/components/schemas/AdminBookingSource'
        studentIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
        guest:
          $ref: '#/components/schemas/PublicGuestParticipantInput'
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: |
            Optional bounded administrator note selected into CREATED audit
            metadata. When omitted, the server derives the audit reason from
            bookingSource as ADMIN_CREATE_PHONE, ADMIN_CREATE_TEACHER, or
            ADMIN_CREATE_ON_SITE; arbitrary free text is never required.
          x-omitted-value-source: bookingSource
          x-derived-values:
            PHONE: ADMIN_CREATE_PHONE
            TEACHER: ADMIN_CREATE_TEACHER
            ON_SITE: ADMIN_CREATE_ON_SITE
      oneOf:
        - title: Enrolled admin booking
          properties:
            participantType:
              const: ENROLLED
          required: [studentIds]
          not:
            required: [guest]
        - title: Guest admin booking
          properties:
            participantType:
              const: GUEST
          required: [guest]
          not:
            required: [studentIds]
      discriminator:
        propertyName: participantType
      additionalProperties: false

    AdminFamilyBookingUpdateRequest:
      type: object
      required: [expectedVersion, reason]
      minProperties: 3
      properties:
        seminarSessionId:
          type: string
          format: uuid
          description: Optional target session for an atomic move; the active family QR is retained.
        attendanceParty:
          $ref: '#/components/schemas/AttendanceParty'
        studentIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 3
          maxLength: 500
      additionalProperties: false

    AdminCancellationRequest:
      type: object
      required: [expectedVersion, cancellationType]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        cancellationType:
          $ref: '#/components/schemas/AdminBookingCancellationType'
      additionalProperties: false

    FreshFamilyBookingMutation:
      type: object
      required: [booking, replayed, qrToken, qrExpiresAt]
      properties:
        booking:
          $ref: '#/components/schemas/FamilyBooking'
        replayed:
          type: boolean
          const: false
        qrToken:
          type: string
          minLength: 43
          maxLength: 512
          description: Single family-level raw token returned only after the fresh commit.
        qrExpiresAt:
          type: string
          format: date-time
      additionalProperties: false

    ReplayedFamilyBookingMutation:
      type: object
      required: [booking, replayed]
      properties:
        booking:
          $ref: '#/components/schemas/FamilyBooking'
        replayed:
          type: boolean
          const: true
      additionalProperties: false

    FamilyBookingMutationResult:
      oneOf:
        - $ref: '#/components/schemas/FreshFamilyBookingMutation'
        - $ref: '#/components/schemas/ReplayedFamilyBookingMutation'

    FamilyBookingPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FamilyBooking'
        page:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false

    QrCredentialMetadata:
      type: object
      required: [credentialId, familyBookingId, version, status, issuedAt, expiresAt, revokedAt]
      properties:
        credentialId:
          type: string
          format: uuid
        familyBookingId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/QrCredentialStatus'
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
      additionalProperties: false

    QrRotationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      additionalProperties: false

    QrRevocationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      additionalProperties: false

    FreshQrRotation:
      type: object
      required: [credential, replayed, qrToken]
      properties:
        credential:
          $ref: '#/components/schemas/QrCredentialMetadata'
        replayed:
          type: boolean
          const: false
        qrToken:
          type: string
          minLength: 43
          maxLength: 512
          description: Raw replacement token returned exactly once.
      additionalProperties: false

    ReplayedQrRotation:
      type: object
      required: [credential, replayed]
      properties:
        credential:
          $ref: '#/components/schemas/QrCredentialMetadata'
        replayed:
          type: boolean
          const: true
      additionalProperties: false

    QrRotationResult:
      oneOf:
        - $ref: '#/components/schemas/FreshQrRotation'
        - $ref: '#/components/schemas/ReplayedQrRotation'

    QrRecoveryResult:
      type: object
      required: [familyBookingId, version, expiresAt, qrToken]
      properties:
        familyBookingId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
        qrToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: AEAD-recovered active QR after digest verification; never logged.
      additionalProperties: false

    PublicQrPass:
      type: object
      required:
        - seminarTitle
        - startsAt
        - location
        - attendanceParty
        - seatCount
        - status
        - maskedContact
      properties:
        seminarTitle:
          type: string
        startsAt:
          type: string
          format: date-time
        location:
          type: string
        attendanceParty:
          $ref: '#/components/schemas/AttendanceParty'
        seatCount:
          type: integer
          enum: [1, 2]
        status:
          $ref: '#/components/schemas/FamilyBookingStatus'
        maskedContact:
          type: string
          maxLength: 40
      additionalProperties: false

    CheckInSource:
      type: string
      enum: [QR, MANUAL]

    CheckInResult:
      type: string
      description: |
        Precise persisted result for every family-level attempt.

        PARTY_SELECTION_REQUIRED is not a failure and not an entry. The QR, session, and
        booking state are already valid, but the booking reserved two parents and the
        request did not say how many actually arrived. The booking is left untouched;
        the scanner asks the operator and retries with attendedCount.
      enum:
        - CHECKED_IN
        - PARTY_SELECTION_REQUIRED
        - ALREADY_CHECKED_IN
        - CANCELLED
        - SESSION_MISMATCH
        - EXPIRED_QR
        - REVOKED_QR
        - INVALID_QR
        - RESERVATION_NOT_FOUND
        - NOT_AUTHORIZED

    AttendedCount:
      description: |
        How many people actually walked in, decided at the gate. This product has no seat
        concept; the only unit is people.

        Independent of what was booked. A one-person booking can arrive as two, and a
        two-person booking can arrive as one — the gate records what happened, because an
        operator who cannot write down the truth will either give up on the number or write
        something false, and both ruin the totals.

        Omit it and the server changes nothing, answering PARTY_SELECTION_REQUIRED so the
        scanner can ask. The upper bound only stops a keypad typo; it is not a policy.
      type: integer
      minimum: 1
      maximum: 20

    QrCheckInRequest:
      type: object
      required: [qrToken]
      properties:
        qrToken:
          type: string
          minLength: 43
          maxLength: 512
          writeOnly: true
          description: Raw family credential; never persisted or logged.
        attendedCount:
          $ref: '#/components/schemas/AttendedCount'
      additionalProperties: false

    ManualCheckInRequest:
      type: object
      required: [familyBookingId]
      properties:
        familyBookingId:
          type: string
          format: uuid
        attendedCount:
          $ref: '#/components/schemas/AttendedCount'
      additionalProperties: false

    CheckInRepresentativeStudent:
      type: object
      required: [participantType, sourceStudentNo, studentName, branch, className, schoolName, grade, unitName]
      properties:
        participantType:
          $ref: '#/components/schemas/BookingParticipantType'
        sourceStudentNo:
          type: string
        studentName:
          type: string
        branch:
          $ref: '#/components/schemas/Branch'
        className:
          type: string
        schoolName:
          type: [string, 'null']
        grade:
          type: [string, 'null']
        unitName:
          type: [string, 'null']
      additionalProperties: false

    CheckInOutcome:
      type: object
      required:
        - eventId
        - result
        - replayed
        - familyBookingId
        - familySeatCount
        - attendedCount
        - attendanceParty
        - representativeStudentName
        - representativeStudent
        - seminarSessionId
        - deviceId
        - branch
        - gateCode
        - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
        result:
          $ref: '#/components/schemas/CheckInResult'
        replayed:
          type: boolean
        familyBookingId:
          description: Null only when an invalid QR cannot be resolved to a family.
          type: [string, 'null']
          format: uuid
        familySeatCount:
          description: Booked party size; null only when no family can be resolved.
          type: [integer, 'null']
          minimum: 1
          maximum: 20
        attendedCount:
          description: |
            How many parents this entry recorded. Set only for CHECKED_IN and
            ALREADY_CHECKED_IN; null for every other result, including
            PARTY_SELECTION_REQUIRED where nothing was recorded yet.
          type: [integer, 'null']
          minimum: 1
          maximum: 20
        attendanceParty:
          description: Family attendance party retained for scanner confirmation; null when no booking resolves.
          oneOf:
            - $ref: '#/components/schemas/AttendanceParty'
            - type: 'null'
        representativeStudentName:
          description: Highest-grade representative student name for the exact scanner confirmation copy.
          type: [string, 'null']
        representativeStudent:
          description: |
            Highest-grade active booking student. Equal-grade candidates are
            ordered by campus, unit, class, name, then source student number.
          oneOf:
            - $ref: '#/components/schemas/CheckInRepresentativeStudent'
            - type: 'null'
        seminarSessionId:
          type: string
          format: uuid
          description: Derived from the required scanner shift lock.
        deviceId:
          type: string
          format: uuid
          description: Derived from the authenticated scanner session.
        branch:
          $ref: '#/components/schemas/Branch'
        gateCode:
          type: string
          maxLength: 100
          description: Derived from the durable device assignment.
        occurredAt:
          type: string
          format: date-time
      additionalProperties: false

    ManualCheckInCandidate:
      type: object
      required:
        - familyBookingId
        - maskedContact
        - attendanceParty
        - seatCount
        - status
        - students
      properties:
        familyBookingId:
          type: string
          format: uuid
        maskedContact:
          type: string
          maxLength: 40
        attendanceParty:
          $ref: '#/components/schemas/AttendanceParty'
        seatCount:
          type: integer
          enum: [1, 2]
        status:
          $ref: '#/components/schemas/FamilyBookingStatus'
        students:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FamilyBookingStudentSnapshot'
      additionalProperties: false

    ManualCheckInCandidateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManualCheckInCandidate'
      additionalProperties: false

    ScannerDeviceStatus:
      type: string
      enum: [ACTIVE, REVOKED, UNPAIRED]

    ScannerDevice:
      type: object
      description: |
        PostgreSQL-owned durable scanner identity plus Redis-derived presence and
        latest optional heartbeat battery telemetry. Unsupported telemetry is null.
      required:
        - deviceId
        - deviceName
        - branch
        - gateCode
        - status
        - pairedAt
        - revokedAt
        - online
        - presenceExpiresAt
        - lastBatteryLevelPercent
        - isCharging
        - batteryReportedAt
      properties:
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
        branch:
          $ref: '#/components/schemas/Branch'
        gateCode:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ScannerDeviceStatus'
        pairedAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        online:
          type: boolean
          description: Ephemeral Redis presence, not a durable audit fact.
        presenceExpiresAt:
          type: [string, 'null']
          format: date-time
        lastBatteryLevelPercent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Latest reported battery percentage; null when unsupported or never reported.
        isCharging:
          type: [boolean, 'null']
          description: Latest charging state; null when unsupported or never reported.
        batteryReportedAt:
          type: [string, 'null']
          format: date-time
          description: Server receipt time of the latest battery telemetry; null when absent.
      additionalProperties: false

    ScannerDevicePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScannerDevice'
        page:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false

    ScannerShiftLock:
      type: object
      required:
        - lockId
        - deviceId
        - branch
        - gateCode
        - seminarSessionId
        - sessionScope
        - sessionBranch
        - lockedAt
        - lockedBy
      properties:
        lockId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        branch:
          $ref: '#/components/schemas/Branch'
        gateCode:
          type: string
          maxLength: 100
        seminarSessionId:
          type: string
          format: uuid
        sessionScope:
          $ref: '#/components/schemas/SeminarSessionScope'
        sessionBranch:
          description: Null for an ALL session; the concrete session branch for BRANCH.
          oneOf:
            - $ref: '#/components/schemas/Branch'
            - type: 'null'
        lockedAt:
          type: string
          format: date-time
        lockedBy:
          type: string
          maxLength: 100
      allOf:
        - if:
            properties:
              sessionScope:
                const: ALL
            required: [sessionScope]
          then:
            properties:
              sessionBranch:
                type: 'null'
        - if:
            properties:
              sessionScope:
                const: BRANCH
            required: [sessionScope]
          then:
            properties:
              sessionBranch:
                $ref: '#/components/schemas/Branch'
      additionalProperties: false

    ScannerShiftState:
      type: object
      required: [locked, lock]
      properties:
        locked:
          type: boolean
        lock:
          oneOf:
            - $ref: '#/components/schemas/ScannerShiftLock'
            - type: 'null'
      additionalProperties: false

    ScannerDeviceDetail:
      type: object
      required: [device, shift]
      properties:
        device:
          $ref: '#/components/schemas/ScannerDevice'
        shift:
          $ref: '#/components/schemas/ScannerShiftState'
      additionalProperties: false

    PairingCodeCreateRequest:
      type: object
      required: [branch, gateCode, intendedDeviceName]
      properties:
        branch:
          $ref: '#/components/schemas/Branch'
        gateCode:
          type: string
          minLength: 1
          maxLength: 100
        intendedDeviceName:
          type: string
          minLength: 1
          maxLength: 100
      additionalProperties: false

    PairingCodeMetadata:
      type: object
      required: [pairingCodeId, branch, gateCode, intendedDeviceName, expiresAt, ttlSeconds]
      properties:
        pairingCodeId:
          $ref: '#/components/schemas/PairingCodeId'
        branch:
          $ref: '#/components/schemas/Branch'
        gateCode:
          type: string
          maxLength: 100
        intendedDeviceName:
          type: string
          maxLength: 100
        expiresAt:
          type: string
          format: date-time
        ttlSeconds:
          type: integer
          const: 300
      additionalProperties: false

    FreshPairingCode:
      type: object
      required: [pairing, replayed, pairingCode]
      properties:
        pairing:
          $ref: '#/components/schemas/PairingCodeMetadata'
        replayed:
          type: boolean
          const: false
        pairingCode:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{6}$'
          description: |
            Raw single-use uppercase code returned once and never logged or
            persisted. The alphabet omits visually ambiguous 0, 1, I, and O.
      additionalProperties: false

    ReplayedPairingCode:
      type: object
      required: [pairing, replayed]
      properties:
        pairing:
          $ref: '#/components/schemas/PairingCodeMetadata'
        replayed:
          type: boolean
          const: true
      additionalProperties: false

    PairingCodeCreateResult:
      oneOf:
        - $ref: '#/components/schemas/FreshPairingCode'
        - $ref: '#/components/schemas/ReplayedPairingCode'

    PairingClaimRequest:
      type: object
      x-pairing-code-normalization: trim-then-uppercase-before-validation
      required: [pairingCode, deviceName, clientPlatform]
      properties:
        pairingCode:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{6}$'
          writeOnly: true
          description: |
            Server normalizes the submitted value by trim then uppercase before
            applying this exact six-character pattern. It is never logged and is
            atomically consumed.
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
        clientPlatform:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false

    PairingClaimResponse:
      type: object
      required: [device, csrfToken]
      properties:
        device:
          $ref: '#/components/schemas/ScannerDevice'
        csrfToken:
          type: string
          minLength: 32
          maxLength: 512
          description: Fresh token for the regenerated SCANNER session; never logged.
      additionalProperties: false

    ScannerCurrent:
      type: object
      required: [device, shift]
      properties:
        device:
          $ref: '#/components/schemas/ScannerDevice'
        shift:
          $ref: '#/components/schemas/ScannerShiftState'
      additionalProperties: false

    ScannerHeartbeatRequest:
      type: object
      required: [clientTime]
      properties:
        clientTime:
          type: string
          format: date-time
          description: Diagnostic only; never authoritative for event chronology.
        batteryLevelPercent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Optional battery percentage; null or omission means unsupported/unavailable.
        isCharging:
          type: [boolean, 'null']
          description: Optional charging state; null or omission means unsupported/unavailable.
      additionalProperties: false

    ScannerHeartbeatResponse:
      type: object
      required: [serverTime, presenceExpiresAt]
      properties:
        serverTime:
          type: string
          format: date-time
        presenceExpiresAt:
          type: string
          format: date-time
      additionalProperties: false

    ScannerShiftLockRequest:
      type: object
      required: [seminarSessionId]
      properties:
        seminarSessionId:
          type: string
          format: uuid
      additionalProperties: false

    ShiftReleaseRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      additionalProperties: false

    DeviceRevocationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      additionalProperties: false

    ScannerSessionList:
      type: object
      required: [items, shift]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicSeminarSession'
        shift:
          $ref: '#/components/schemas/ScannerShiftState'
      additionalProperties: false

    AuditActorType:
      type: string
      enum: [ADMIN, SCANNER, PUBLIC_PROOF, SYSTEM]

    AuditActor:
      type: object
      required: [type, subjectId, displayName]
      properties:
        type:
          $ref: '#/components/schemas/AuditActorType'
        subjectId:
          type: [string, 'null']
          format: uuid
        displayName:
          type: [string, 'null']
          maxLength: 100
      additionalProperties: false

    SafeAuditMetadata:
      type: object
      description: |
        Allowlisted metadata only. QR/OTP/pairing/proof/cookie raw values, full
        contact, passwords, and upstream request or response bodies are forbidden.
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 500
          - type: integer
          - type: number
          - type: boolean
          - type: 'null'

    BookingAuditEventType:
      type: string
      enum:
        - CREATED
        - UPDATED
        - CANCELLED
        - QR_ISSUED
        - QR_ROTATED
        - QR_REVOKED
        - CHECKED_IN
        - MARKED_NO_SHOW

    BookingAuditEvent:
      type: object
      description: Append-only; update and delete are blocked at the persistence layer.
      required:
        - eventId
        - sequence
        - familyBookingId
        - type
        - actor
        - cancellationType
        - reason
        - scannerDeviceName
        - scannerEntranceName
        - scannerGateCode
        - metadata
        - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
        sequence:
          $ref: '#/components/schemas/AuditSequence'
        familyBookingId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/BookingAuditEventType'
        actor:
          $ref: '#/components/schemas/AuditActor'
        cancellationType:
          description: Non-null only for CANCELLED events.
          oneOf:
            - $ref: '#/components/schemas/BookingCancellationType'
            - type: 'null'
        reason:
          type: [string, 'null']
          maxLength: 500
        scannerDeviceName:
          type: [string, 'null']
          maxLength: 120
          description: Immutable check-in snapshot; remains available after scanner hard deletion.
        scannerEntranceName:
          type: [string, 'null']
          maxLength: 160
          description: Immutable entrance/location snapshot; remains available after scanner hard deletion.
        scannerGateCode:
          type: [string, 'null']
          maxLength: 100
          description: Immutable gate snapshot; remains available after scanner hard deletion.
        metadata:
          $ref: '#/components/schemas/SafeAuditMetadata'
        occurredAt:
          type: string
          format: date-time
      additionalProperties: false

    BookingAuditEventPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          description: Strict sequence-ascending chronology.
          items:
            $ref: '#/components/schemas/BookingAuditEvent'
        page:
          $ref: '#/components/schemas/EventPageMeta'
      additionalProperties: false

    CheckInAuditEvent:
      type: object
      description: |
        Append-only check-in attempt. Success, duplicate, and every safe failure
        are retained. No raw QR or contact value appears.
      required:
        - eventId
        - sequence
        - familyBookingId
        - credentialId
        - seminarSessionId
        - source
        - result
        - familySeatCount
        - deviceId
        - scannerDeviceName
        - scannerEntranceName
        - scannerGateCode
        - branch
        - gateCode
        - actor
        - idempotencyKeyDigest
        - metadata
        - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
        sequence:
          $ref: '#/components/schemas/AuditSequence'
        familyBookingId:
          type: [string, 'null']
          format: uuid
        credentialId:
          type: [string, 'null']
          format: uuid
        seminarSessionId:
          type: string
          format: uuid
        representativeStudentName:
          type: [string, 'null']
          description: Snapshot name of one active participant, for live operator logs. Null when the booking or its rows are gone.
        source:
          $ref: '#/components/schemas/CheckInSource'
        result:
          $ref: '#/components/schemas/CheckInResult'
        familySeatCount:
          type: [integer, 'null']
          minimum: 1
          maximum: 20
        deviceId:
          type: [string, 'null']
          format: uuid
          description: Null after scanner hard deletion; immutable display snapshots remain populated for new events.
        scannerDeviceName:
          type: [string, 'null']
          maxLength: 120
          description: Immutable device-name snapshot retained independently of scannerDeviceId.
        scannerEntranceName:
          type: [string, 'null']
          maxLength: 160
          description: Immutable entrance/location snapshot retained independently of scannerDeviceId.
        scannerGateCode:
          type: [string, 'null']
          maxLength: 100
          description: Immutable gate snapshot retained independently of scannerDeviceId.
        branch:
          $ref: '#/components/schemas/Branch'
        gateCode:
          type: string
          maxLength: 100
        actor:
          $ref: '#/components/schemas/AuditActor'
        idempotencyKeyDigest:
          type: string
          minLength: 32
          maxLength: 128
        metadata:
          $ref: '#/components/schemas/SafeAuditMetadata'
        occurredAt:
          type: string
          format: date-time
      additionalProperties: false

    CheckInAuditEventPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          description: Strict sequence-ascending chronology.
          items:
            $ref: '#/components/schemas/CheckInAuditEvent'
        page:
          $ref: '#/components/schemas/EventPageMeta'
      additionalProperties: false

    StudentAuditEventType:
