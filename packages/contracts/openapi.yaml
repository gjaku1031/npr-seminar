  /api/v1/scanner/check-ins/qr:
    post:
      operationId: checkInFamilyByQr
      tags: [Scanner check-in]
      summary: Append a family-level QR check-in attempt
      description: |
        Request contains only the raw QR credential. The server derives deviceId,
        branch, gateCode, and seminarSessionId from the authenticated scanner
        session and required shift lock, preventing client spoofing. Every valid,
        invalid, duplicate, revoked, expired, cancelled, mismatch, and unauthorized
        attempt is append-only. The raw QR is never stored or logged. Only the
        first successful RESERVED-to-CHECKED_IN transition appends per-child
        CHECKED_IN Google Sheets outbox deliveries in the same transaction.
        Duplicate scans remain application audit events but never append another
        Sheet success projection. The worker writes 참석완료 to 예약명단
        처리상태 and every matching branch roster 참/불 cell, then appends one
        QR입장 / 참석완료 예약로그 row per child.
      security:
        - cookieAuth: []
      x-required-roles: [SCANNER]
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-csrf: true
      x-requires-same-origin: true
      x-google-sheets-outbox-event: CHECKED_IN_FIRST_SUCCESS_ONLY
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrCheckInRequest'
      responses:
