    SmsTargetRequest:
      type: object
      required: [branch, seminarSessionId, audience]
      properties:
        branch:
          $ref: '#/components/schemas/Branch'
        seminarSessionId:
          type: string
          format: uuid
        audience:
          $ref: '#/components/schemas/SmsAudience'
        templateId:
          type: string
          format: uuid
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Template text supporting {학생명}, {설명회명}, {일시}, {장소}, {QR링크}, and {문의전화}.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Optional title template; each rendered recipient payload must classify as LMS and remain within 44 EUC-KR bytes.
      oneOf:
        - required: [templateId]
          not:
            anyOf:
              - required: [message]
              - required: [title]
        - required: [message]
          not:
            required: [templateId]
      additionalProperties: false

    SmsEnqueueRequest:
      type: object
      required: [branch, seminarSessionId, audience, previewToken]
      properties:
        branch:
          $ref: '#/components/schemas/Branch'
        seminarSessionId:
          type: string
          format: uuid
        audience:
          $ref: '#/components/schemas/SmsAudience'
        templateId:
          type: string
          format: uuid
        message:
          type: string
          minLength: 1
          maxLength: 2000
        title:
          type: string
          minLength: 1
          maxLength: 200
        previewToken:
          type: string
          minLength: 20
          maxLength: 100
        scheduledAt:
          type: string
          format: date-time
          description: |
            When the send should leave. Omit to send now.

            Scheduling is one field on each queued message: the worker already claims only
            rows whose next attempt time has arrived, so a future time simply waits in the
            same queue and then travels the ordinary path. No separate scheduler exists, and
            a scheduled batch is subject to the same allowlist and disabled-gateway rules at
            the moment it actually sends, not at the moment it was scheduled.

            A time in the past is rejected rather than sent immediately — pressing "schedule"
            and having it go out at once is the opposite of what the operator asked for.
            Times far in the future are rejected too, so one mistyped year cannot leave
            messages queued for a decade.
      oneOf:
        - required: [templateId]
          not:
            anyOf:
              - required: [message]
              - required: [title]
        - required: [message]
          not:
            required: [templateId]
      additionalProperties: false

