          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        retryAfterSeconds:
          type: integer
          const: 60
      additionalProperties: false

    OtpVerifyRequest:
      type: object
      required: [oneTimeCode]
      properties:
        oneTimeCode:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
          description: Never persisted or logged in raw form.
      additionalProperties: false

    FreshOtpProofIssued:
      type: object
      required: [bookingProof, expiresAt, scopes, replayed]
      properties:
        bookingProof:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Fresh 256-bit base64url X-Booking-Proof returned once; never persisted or logged.
        expiresAt:
          type: string
          format: date-time
        scopes:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BookingProofScope'
        replayed:
          type: boolean
          const: false
      additionalProperties: false

    ReplayedOtpProofIssued:
      type: object
      description: Secret-free idempotency replay; a lost raw proof cannot be recovered.
      required: [expiresAt, scopes, replayed]
      properties:
        expiresAt:
          type: string
          format: date-time
        scopes:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BookingProofScope'
        replayed:
          type: boolean
          const: true
      additionalProperties: false

