        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: archiveSmsTemplate
      tags: [Admin SMS]
      summary: Delete an unused template or archive a used template
      description: |
        If-Match carries the current decimal version string. The operation takes
        the same transaction-scoped lifecycle lock as create, update, and default
        reassignment. A template without any SMS outbox snapshot is hard-deleted;
        a template with usage history is preserved and transitioned to inactive.
        A current default is never deleted or archived: another active template
        of the same purpose must first be made default. Idempotent replay returns
        the original deletion or archival result even after a hard delete.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-csrf: true
      x-requires-same-origin: true
      x-hard-delete: conditional-unused
      x-delete-missing: not-found-except-idempotency-replay
      x-delete-dependencies:
        smsOutboxSnapshots: preserve
        activeDefault: reassign-before-removal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '200':
          description: Conditional hard-deletion or archival result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsTemplateRemovalResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/sms/targets/counts:
    get:
      operationId: countSmsTargets
      tags: [Admin SMS]
      summary: Count recipients per audience for one branch and session
      description: |
        How many people each audience would actually reach, so the operator sees the size
        of a send before committing to it — and sees it on the tab itself, not only after
        asking for a preview.

        The counts come from the same recipient selection the send uses, not from booking
        status alone: the cancelled audience re-derives its students from the latest release
        time, which can leave a booking with no recipient at all. A number that disagrees
        with what actually goes out is worse than no number.

        Read-only. Unlike the preview it mints no preview token, so calling it while the
        operator switches branch or session never creates authority to send.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      parameters:
        - in: query
          name: branch
          required: true
          schema:
            $ref: '#/components/schemas/Branch'
        - in: query
          name: seminarSessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recipient count for every audience
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsTargetCounts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/sms/targets/preview:
    post:
      operationId: previewSmsTargets
      tags: [Admin SMS]
      summary: Preview a target snapshot and classified payload
      description: |
        This ephemeral calculation persists no message or recipient mutation.
        Exactly one of templateId or message is accepted. The seven supported
        variables are rendered independently for each recipient. At most ten
        masked, fully rendered samples are returned; full contact values never
        leave the server.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      x-mutation-kind: ephemeral
      x-idempotency: exempt
      x-idempotency-exemption-reason: read-only-target-snapshot-calculation
      x-requires-csrf: true
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsTargetRequest'
      responses:
        '200':
          description: Current target snapshot and payload classification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsTargetPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/sms/sends:
    post:
      operationId: enqueueSmsSend
      tags: [Admin SMS]
      summary: Enqueue an administrator group SMS or LMS send
      description: The preview token must still match the exact recipients, session, template version, and rendered payloads or the request fails with 409.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-csrf: true
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsEnqueueRequest'
      responses:
        '202':
          description: Recipient messages durably queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsEnqueueAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/admin/sms/sends/{batchId}/cancel:
    parameters:
      - in: path
        name: batchId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelSmsBatch
      tags: [Admin SMS]
      summary: Cancel the messages of a batch that have not left yet
      description: |
        A scheduled send that cannot be stopped is a loaded gun; this is the safety.

        Only PENDING messages are cancelled. Messages the worker already holds (CLAIMED,
        SENDING) are left alone so the lease invariant is not broken mid-flight, and sent
        messages are not touched at all — a delivered SMS cannot be recalled, and pretending
        otherwise would be a lie to the operator. The response therefore reports both how
        many were stopped and how many had already left, so nobody reads a partial stop as
        a complete one.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      x-hard-delete: forbidden
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-csrf: true
      x-requires-same-origin: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Cancellation outcome for the batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsBatchCancellation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/sms/messages:
    get:
      operationId: listSmsMessages
      tags: [Admin SMS]
      summary: List recent SMS outbox messages newest first
      description: Returns masked recipients and safe provider metadata only; message bodies and full contacts are excluded.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SmsDeliveryStatus'
        - name: source
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SmsPurpose'
        - $ref: '#/components/parameters/BranchQuery'
        - name: seminarSessionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: batchId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recent safe SMS history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsMessageList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/sms/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/SmsMessageId'
    get:
      operationId: getSmsMessage
      tags: [Admin SMS]
      summary: Get one SMS outbox message and append-only attempts
      description: Attempt events are immutable and never expose message bodies, credentials, or full recipients.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: Safe message detail and chronological attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsMessageDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/sheets/readiness:
    get:
      operationId: getGoogleSheetsReadiness
      tags: [Admin Google Sheets]
      summary: Inspect Google Sheets projection readiness and safety gate
      description: |
        Returns non-secret capability, deployment-readiness, and delivery-count
        flags. `outboundProjectionSupported` describes the implemented
        PostgreSQL-to-Sheet feature. `liveWritesSupported` describes whether the
        current deployment has passed its credentials, mapping, workbook
        security, and schema gates; `false` does not remove the outbound feature.
        Inbound Sheet synchronization is never supported.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: Google Sheets projection readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleSheetsReadiness'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/sheets/mappings:
    get:
      operationId: listGoogleSheetsMappings
      tags: [Admin Google Sheets]
      summary: List seminar session to workbook mappings
      description: |
        Lists the configured outbound projection mappings. These read-only admin
        APIs do not expose a Sheet-to-application import or mutation surface.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: Safe mapping status list without spreadsheet credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleSheetsMappingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/sheets/deliveries:
    get:
      operationId: listGoogleSheetsDeliveries
      tags: [Admin Google Sheets]
      summary: List recent Google Sheets projection deliveries newest first
      description: |
        Payload snapshots are encrypted at rest and never returned by this
        endpoint. A delivery represents one booking child for CREATED, UPDATED,
        CANCELLED, or the first successful QR CHECKED_IN domain event. The
        current-state projection updates 예약명단 and the matching branch roster;
        예약로그 is append-only. A CHECKED_IN projection writes 참석완료 to the
        branch roster 참/불 field and to 예약명단 처리상태, then appends
        QR입장 / 참석완료 to 예약로그.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GoogleSheetsDeliveryStatus'
        - name: seminarSessionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recent safe delivery history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleSheetsDeliveryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/sheets/deliveries/{deliveryId}:
    parameters:
      - $ref: '#/components/parameters/GoogleSheetsDeliveryId'
    get:
      operationId: getGoogleSheetsDelivery
      tags: [Admin Google Sheets]
      summary: Get one Google Sheets delivery and append-only attempts
      description: Attempts are immutable and exclude workbook payload data and student contact values.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: Safe delivery detail and chronological attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleSheetsDeliveryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: npr_seminar_session
      description: |
        Opaque project-specific Redis session cookie for ADMIN and SCANNER.
        Production attributes are HttpOnly, Secure, SameSite=Lax, Path=/, with
        no Domain where possible. Cookie values are never logged.
    bookingProof:
      type: apiKey
      in: header
      name: X-Booking-Proof
      description: |
        Short-lived 256-bit base64url bearer credential bound to a normalized
        family contact digest, purpose-derived scopes, and expiry. PostgreSQL
        stores SHA-256(proof) only. The raw value is returned once, is independent
        from the project session cookie, and must be redacted from every log.
    qrCredential:
      type: apiKey
      in: header
      name: X-QR-Token
      description: |
        Opaque family QR credential used only for the minimal public pass.
        The raw value is secret, never persisted, and redacted from all logs.

  headers:
    ProjectSessionCookie:
      description: |
        Project session cookie. The raw value is intentionally undocumented and
        MUST be redacted by the application, reverse proxy, tracing, and analytics.
      schema:
        type: string
    ExpiredProjectSessionCookie:
      description: Expired project session cookie; raw historical values are never emitted or logged.
      schema:
        type: string

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Caller-generated UUID scoped to actor and operation. Same key and same
        canonical request replays the stored secret-free result; same key with a
        different request returns 409. Raw one-time QR or pairing secrets are
        never present in replay snapshots.
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token. The value is secret and MUST NOT be logged.
      schema:
        type: string
        minLength: 32
        maxLength: 512
    Origin:
      name: Origin
      in: header
      required: true
      description: Exact configured browser origin; server also validates Host and trusted proxy metadata.
      schema:
        type: string
        format: uri
        maxLength: 300
    ChallengeId:
      name: challengeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeminarId:
      name: seminarId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeminarSessionId:
      name: seminarSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FamilyBookingId:
      name: familyBookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PosterVersion:
      name: version
      in: path
      required: true
      description: Lowercase SHA-256 hash of the exact poster bytes.
      schema:
        $ref: '#/components/schemas/PosterVersion'
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PairingCodeId:
      name: pairingCodeId
      in: path
      required: true
      description: Opaque pairing-code record identifier; never the raw displayed code.
      schema:
        $ref: '#/components/schemas/PairingCodeId'
    SmsTemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SmsMessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoogleSheetsDeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      description: Current optimistic-lock version encoded as an unsigned decimal string.
      schema:
        type: string
        pattern: '^[0-9]+$'
        minLength: 1
        maxLength: 20
    BranchQuery:
      name: branch
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Branch'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AfterSequence:
      name: afterSequence
      in: query
      required: false
      description: Return immutable events with sequence greater than this value.
      schema:
        type: string
        pattern: '^[0-9]+$'
        default: '0'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    BadRequest:
      description: Malformed input, invalid header, or invalid confirmation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired, invalid, or revoked session/proof/credential
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role, CSRF, same-origin, contact ownership, or scope check failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or intentionally concealed from this actor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State transition, duplicate, lock, version, or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Syntactically valid request violates aggregate ownership or domain rules
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Credential or short-lived code is expired, consumed, or revoked
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until this request class may be retried
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Uploaded poster exceeds the 10 MiB hard limit
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Request media type or poster raster signature is unsupported or inconsistent
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Required PostgreSQL, Redis, source, or cryptographic configuration is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OtpProviderUnavailable:
      description: |
        OTP cryptographic configuration, SMS outbox infrastructure, or a required
        provider dependency is unavailable. No fixture proof or bypass is issued.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    EmptyObject:
      type: object
      maxProperties: 0
      additionalProperties: false

    PosterMediaType:
      type: string
      enum: [image/png, image/jpeg, image/webp]

    PosterVersion:
      type: string
      pattern: '^[a-f0-9]{64}$'
      description: Lowercase SHA-256 hash of the exact poster bytes.

    PosterDescriptor:
      type: object
      required: [version, imageUrl, mediaType, sizeBytes, updatedAt]
      properties:
        version:
          $ref: '#/components/schemas/PosterVersion'
        imageUrl:
          type: string
          format: uri-reference
          pattern: '^/api/v1/public/poster/image/[a-f0-9]{64}$'
        mediaType:
          $ref: '#/components/schemas/PosterMediaType'
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    CurrentPosterResponse:
      type: object
      required: [poster]
      properties:
        poster:
          description: Null is the explicit safe state before the first upload.
          oneOf:
            - $ref: '#/components/schemas/PosterDescriptor'
            - type: 'null'
      additionalProperties: false

    PosterUploadResult:
      type: object
      required: [poster]
      properties:
        poster:
          $ref: '#/components/schemas/PosterDescriptor'
      additionalProperties: false

    Problem:
      type: object
      description: RFC 9457 problem details. Secret or upstream raw values are forbidden in every field.
      required: [type, title, status, detail, instance, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,80}$'
        traceId:
          type: string
          minLength: 16
          maxLength: 128
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemFieldError'
      additionalProperties: true

    ProblemFieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 100
      additionalProperties: false

    Branch:
      type: string
      enum: [CAMPUS_A, CAMPUS_B, CAMPUS_C]
      x-labels:
        CAMPUS_A: A
        CAMPUS_B: B
        CAMPUS_C: C

    PairingCodeId:
      type: string
      format: uuid
      description: Opaque pairing-code record identifier, distinct from the raw six-character code.

    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      additionalProperties: false

    EventPageMeta:
      type: object
      required: [nextAfterSequence, hasMore]
      properties:
        nextAfterSequence:
          type: [string, 'null']
          pattern: '^[0-9]+$'
        hasMore:
          type: boolean
      additionalProperties: false

    AuditSequence:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Decimal PostgreSQL bigint serialized as a JSON string to preserve precision.

    ActorRole:
      type: string
      enum: [ADMIN, SCANNER]

    CurrentActor:
      type: object
      required: [subjectId, role, displayName, deviceId, idleExpiresAt, absoluteExpiresAt]
      properties:
        subjectId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/ActorRole'
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        deviceId:
          description: Present only for SCANNER.
          type: [string, 'null']
          format: uuid
