          type: string
          pattern: '^\*\*\*-\*\*\*\*-[0-9]{4}$'
        message:
          type: string
          minLength: 1
          maxLength: 2000
        title:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
        messageType:
