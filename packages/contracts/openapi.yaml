  /api/v1/public/family-bookings/lookup:
    post:
      operationId: lookupMaskedFamilyBookingsByContact
      tags: [Public family bookings]
      summary: Look up masked reservations using the normalized full phone number
      description: |
        This ephemeral same-origin lookup deliberately requires the full phone but
        no cookie, OTP, or booking proof. It matches only the keyed full-contact
        digest and returns at most 100 masked aggregates. No match is an empty
        items array. Responses never include a full phone, full participant name,
        student number, school, class, teacher, raw QR, or access credential.
        Redis independently rate limits contact, IP, and global request classes;
        audit events contain only truncated fingerprints and the result count.
      security: []
      x-mutation-kind: ephemeral
      x-idempotency: exempt
      x-idempotency-exemption-reason: Read-only lookup creates no durable business resource or booking transition; rate counters and audit telemetry do not authorize or mutate a booking.
      x-requires-same-origin: true
      x-rate-limit-error-code: BOOKING_LOOKUP_RATE_LIMITED
      x-rate-limits:
        contact: {maximum: 10, windowSeconds: 900}
        ip: {maximum: 30, windowSeconds: 900}
        global: {maximum: 600, windowSeconds: 60}
      x-audit-pii-policy: fingerprints-and-result-count-only
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicFamilyBookingLookupRequest'
      responses:
        '200':
          description: Newest-first masked matches, or an empty list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMaskedFamilyBookingList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
