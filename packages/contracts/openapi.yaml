    AdminStudent:
      type: object
      required:
        - studentId
        - sourceStudentNo
        - name
        - branch
        - schoolName
        - grade
        - teacherName
        - motherPhone
        - fatherPhone
        - unitName
        - sourceActive
        - mathClassName
        - scienceClassNames
        - hasReservation
        - reservation
        - representativeClass
        - assignments
        - firstSeenAt
        - lastSeenAt
      properties:
        studentId:
          type: string
          format: uuid
        sourceStudentNo:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 100
        branch:
          $ref: '#/components/schemas/Branch'
        schoolName:
          type: [string, 'null']
          maxLength: 200
        grade:
          type: [string, 'null']
          maxLength: 40
        teacherName:
          type: [string, 'null']
          maxLength: 100
          description: |
            Required and nullable math-homeroom teacher. When mathClassName is
            non-null, this is the NFKC-normalized first comma-separated value
            from students.teacher_name. When mathClassName is null, including
            for science-only students, this is null even when the student row
            or assignments contain teacher names. StudentSourceAssignment
            teacherName values are traceability only and never homeroom sources
            or fallbacks.
          x-required-nullable: true
          x-homeroom-applicability: MATH_REGULAR_CLASS_ONLY
          x-source-field: students.teacher_name
          x-source-condition: MATH_CLASS_PRESENT
          x-normalization: NFKC_TRIM_FIRST_COMMA_VALUE
          x-science-only-policy: RETURN_NULL
          x-no-math-policy: RETURN_NULL
          x-assignment-teacher-role: TRACEABILITY_ONLY
          x-assignment-teacher-fallback: forbidden
        motherPhone:
          type: [string, 'null']
          minLength: 8
          maxLength: 15
          pattern: '^[0-9]{8,15}$'
          description: Full normalized mother phone; ADMIN response only and forbidden from logs and audit metadata.
        fatherPhone:
          type: [string, 'null']
          minLength: 8
          maxLength: 15
          pattern: '^[0-9]{8,15}$'
          description: Full normalized father phone; ADMIN response only and forbidden from logs and audit metadata.
        unitName:
          type: [string, 'null']
          enum: [과학, 예고1, 특목, 예중1, 초등, 고등, 중등1, 중등2, 중등3, null]
          maxLength: 100
        sourceActive:
          type: boolean
        mathClassName:
          type: [string, 'null']
          maxLength: 200
          description: Preferred exact NFKC-normalized active representative non-science class, including a valid raw timetable suffix. The persisted representative class wins when its exact normalized name is eligible; otherwise the stable first eligible name is used.
        scienceClassNames:
          type: array
          description: Exact-name-de-duplicated stable order of every NFKC-normalized active representative science class. Valid raw timetable suffixes are preserved.
          items:
            type: string
            minLength: 1
            maxLength: 200
        hasReservation:
          type: boolean
          description: True when the selected seminar-session projection has status RESERVED, CHECKED_IN, or NO_SHOW. False for CANCELLED, when no matching booking exists, and when seminarSessionId is omitted.
        reservation:
          description: Selected seminar-session booking projection, or null when seminarSessionId is omitted or the student has no booking in that session.
          anyOf:
            - $ref: '#/components/schemas/AdminStudentReservation'
            - type: 'null'
        representativeClass:
          $ref: '#/components/schemas/RepresentativeClass'
        assignments:
          type: array
          description: All current source assignments, including supplementary assignments.
          items:
            $ref: '#/components/schemas/StudentSourceAssignment'
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
      additionalProperties: false

    AdminStudentDetail:
      $ref: '#/components/schemas/AdminStudent'

    AdminStudentReservation:
      type: object
      required: [status, hasReservation, familyBookingId, attendanceParty, bookingSource]
      properties:
        status:
          $ref: '#/components/schemas/FamilyBookingStatus'
        hasReservation:
          type: boolean
          description: Uses the same status rule as the parent AdminStudent.hasReservation field; CANCELLED is false.
        familyBookingId:
          type: string
          format: uuid
        attendanceParty:
          $ref: '#/components/schemas/AttendanceParty'
        bookingSource:
          $ref: '#/components/schemas/BookingSource'
      additionalProperties: false

    AdminStudentReviewReasonCode:
      type: string
