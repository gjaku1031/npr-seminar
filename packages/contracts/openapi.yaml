        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicFamilyBookingUpdateRequest'
      responses:
        '200':
          description: Updated family aggregate; raw QR is never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMaskedFamilyBooking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
