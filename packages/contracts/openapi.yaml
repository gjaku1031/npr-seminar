  /api/v1/admin/scanner-devices/pairing-codes/{pairingCodeId}:
    parameters:
      - $ref: '#/components/parameters/PairingCodeId'
    delete:
      operationId: cancelScannerPairingCode
      tags: [Admin scanner devices]
      summary: Cancel one unused scanner pairing code
      description: |
        pairingCodeId is an opaque UUID; the raw displayed pairing code is never
        accepted in the path, persisted, logged, or written to audit metadata.
        The server atomically races cancellation against claim. Exactly one wins:
        cancelling an unused code invalidates it and appends a secret-free audit
        event, while an already claimed code returns 409 with
        PAIRING_CODE_ALREADY_CLAIMED. Replaying a successful cancellation is 204.
        A nonexistent or other-tenant identifier is concealed as 404.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      x-hard-delete: forbidden
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-csrf: true
      x-requires-same-origin: true
      x-race-arbitration: atomic-exactly-one-of-claim-or-cancel
      x-audit-redaction: raw-pairing-code-forbidden
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Unused code cancelled, or idempotent replay of that cancellation
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Pairing code was claimed before cancellation won the atomic race
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                alreadyClaimed:
                  value:
                    type: /problems/pairing-code-already-claimed
                    title: Pairing code already claimed
                    status: 409
                    detail: The pairing code was claimed before cancellation won the atomic race.
                    instance: /api/v1/admin/scanner-devices/pairing-codes/00000000-0000-4000-8000-000000000000
                    code: PAIRING_CODE_ALREADY_CLAIMED
                    traceId: 0000000000000000
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

