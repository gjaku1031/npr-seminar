  /api/v1/admin/students:
    get:
      operationId: listAdminStudents
      tags: [Admin students]
      summary: List students with source assignments and representative resolution
      description: |
        Source assignments are preserved in full. Representative candidates use
        the corrected rules after stripping one validated terminal timetable
        suffix: science when the base className starts with 과 or names a
        science subject such as 물리, 화학, 생명과학/생물, or 지구과학; science
        displays as 과학. Names containing 특강, 패키지, 입시대비, or TEST
        case-insensitively are supplementary and excluded only from representative
        candidates. Accepted suffixes are distinct weekday sequences of one to
        three characters with an optional positive 1..99 slot without a leading
        zero, or E/e with that slot. Asterisks and every other bracket form are
        rejected. 기하[시간] is retained as subject-only, not representative.
        고3이과T is regular. One regular wins; zero regular plus one
        or more science becomes 과학; multiple regular or no regular/science is
        ambiguous. Active representative assignments are projected once for
        display, grouping, and ordering. Math is every eligible non-science
        assignment; science-only means eligible science and no math. Students
        with both retain both projections, and the unfiltered list excludes
        neither category. Projected class names preserve the exact NFKC-normalized
        raw timetable suffix and de-duplicate exact names only. Results are sorted
        before pagination by branch CAMPUS_A, CAMPUS_B, CAMPUS_C; then projected unit,
        projected class, student name, and source student number ascending.
        facets.teachers contains distinct primary teacher names (NFKC-normalized,
        comma-delimited source values reduced to the first name) across the full
        non-paginated result for every current filter except teacherName, but only
        for students whose active classification projection has at least one math
        class. Science-only and otherwise no-math students never contribute a
        teacher facet and can never match teacherName. The selected teacher
        continues to filter items and page totals but never narrows its own option
        list. summary is intentionally separate: all
        fields except reviewRequiredStudentCount aggregate sourceActive=true
        students for only the selected branch and unitGroup and ignore every
        other list filter. reviewRequiredStudentCount uses sourceActive=true and
        branch only, ignoring unitGroup and every other list filter.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/BranchQuery'
        - name: query
          in: query
          required: false
          description: Allowlisted search over name, school, source student number, or approved contact lookup.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: grade
          in: query
          required: false
          deprecated: true
          description: Compatibility-only legacy filter. New clients use unitGroup; this parameter will be removed after the transition window.
          schema:
            type: string
            maxLength: 40
        - name: unitGroup
          in: query
          required: false
          description: Same canonical unit grouping as the reservation roster. GUEST returns an empty student-status page because guests are not synchronized students.
          schema:
            $ref: '#/components/schemas/RosterUnitGroup'
        - name: representativeClass
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: teacherName
          in: query
          required: false
          description: Exact math-homeroom teacher filter. NFKC normalization is applied and only the first comma-delimited student-row name is used. Science-only and other no-math students never match.
          schema:
            type: string
            maxLength: 100
        - name: unitName
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: resolution
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RepresentativeResolution'
        - name: sourceActive
          in: query
          required: false
          schema:
            type: boolean
        - name: categorizedOnly
          in: query
          required: false
          description: When true, items, page totals, and teacher facets include only students with at least one recognizable active math or science class. False or omission does not apply this filter. Classification summary fields ignore it.
          schema:
            type: boolean
        - name: seminarSessionId
          in: query
          required: false
          description: When supplied, adds one booking projection for each page student in this seminar session, prioritizing an active RESERVED or CHECKED_IN booking and otherwise selecting the latest historical booking. The projection is fetched in one page-level batch. When omitted or no booking matches, reservation is null and hasReservation is false. hasReservation is true for RESERVED, CHECKED_IN, and NO_SHOW, and false for CANCELLED.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Student page, page-independent primary-teacher facets, and independently reported multi-assignment/classification summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStudentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

