        - reservedBookingCount
        - checkedInBookingCount
        - cancelledBookingCount
        - noShowBookingCount
        - monitoring
      properties:
        activeBookingCount:
          type: integer
          minimum: 0
          description: RESERVED plus CHECKED_IN family bookings.
        reservedBookingCount:
          type: integer
          minimum: 0
        checkedInBookingCount:
          type: integer
          minimum: 0
        cancelledBookingCount:
          type: integer
          minimum: 0
        noShowBookingCount:
          type: integer
          minimum: 0
        monitoring:
          $ref: '#/components/schemas/AttendanceMonitoring'
      additionalProperties: false

    SessionStatisticsUnit:
      type: object
