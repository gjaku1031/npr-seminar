    SessionOperationsSummary:
      type: object
      description: Family-booking aggregate counts for POC session operations.
      required:
        - activeBookingCount
        - checkedInBookingCount
        - uncheckedBookingCount
        - cancelledBookingCount
        - noShowBookingCount
        - attendeeCount
        - attendedPeopleCount
      properties:
        activeBookingCount:
          type: integer
          minimum: 0
          description: RESERVED plus CHECKED_IN family bookings.
        checkedInBookingCount:
          type: integer
          minimum: 0
          description: CHECKED_IN family bookings.
        uncheckedBookingCount:
          type: integer
          minimum: 0
          description: RESERVED family bookings only; NO_SHOW is excluded.
        cancelledBookingCount:
          type: integer
          minimum: 0
          description: CANCELLED family bookings.
        noShowBookingCount:
          type: integer
          minimum: 0
          description: NO_SHOW family bookings, excluded from active and unchecked.
        attendeeCount:
          type: integer
          minimum: 0
          description: Active RESERVED/CHECKED_IN parents; MOTHER=1, FATHER=1, BOTH=2. Children never increase this count.
        attendedPeopleCount:
          type: integer
          minimum: 0
          description: |
            Parents who actually walked in, summed from the per-booking attendedCount the
            gate confirmed. Distinct from attendeeCount, which is what the bookings expect:
            a two-parent booking that arrives with one parent contributes 2 there and 1 here.
      additionalProperties: false

    AttendanceMonitoring:
      type: object
      description: |
        Three active-participation monitoring counts. studentCount is the number of
        student/guest rows attached to RESERVED or CHECKED_IN family bookings;
        familyBookingCount de-duplicates those sibling rows by family booking; and
        attendeeCount counts their parents with MOTHER=1, FATHER=1, and BOTH=2.
        CANCELLED and NO_SHOW contribute zero to every monitoring field.
      required: [studentCount, familyBookingCount, attendeeCount]
      properties:
        studentCount:
          type: integer
          minimum: 0
        familyBookingCount:
          type: integer
          minimum: 0
        attendeeCount:
          type: integer
          minimum: 0
      additionalProperties: false

