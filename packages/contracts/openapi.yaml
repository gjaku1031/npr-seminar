    SyncCounts:
      type: object
      description: |
        Counts never conflate assignments with unique students. fetched is raw
        assignment rows; bracketExcluded is the legacy field name for rows
        rejected by the class-name policy. Active bracketless names and names
        with exactly one terminal timetable suffix are included. A timetable
        suffix is one to three distinct weekdays plus an optional positive
        1..99 slot without a leading zero, or E/e plus that slot. Names with an
        asterisk, any other bracket form, repeated weekdays, zero/leading-zero
        slots, or another Latin prefix are rejected.
        Student and assignment mutation counts are independently reported.
      required:
        - fetchedAssignmentCount
        - bracketExcludedAssignmentCount
        - includedAssignmentCount
        - uniqueStudentCount
        - multiAssignmentStudentCount
        - regularRepresentativeCount
        - scienceAliasRepresentativeCount
        - multipleRegularAmbiguousCount
        - noClassAmbiguousCount
        - ambiguousStudentCount
        - insertedStudentCount
        - updatedStudentCount
        - inactivatedStudentCount
        - insertedAssignmentCount
        - updatedAssignmentCount
        - inactivatedAssignmentCount
      properties:
        fetchedAssignmentCount:
          type: integer
          minimum: 0
        bracketExcludedAssignmentCount:
          type: integer
          minimum: 0
        includedAssignmentCount:
          type: integer
          minimum: 0
        uniqueStudentCount:
          type: integer
          minimum: 0
        multiAssignmentStudentCount:
          type: integer
          minimum: 0
        regularRepresentativeCount:
          type: integer
          minimum: 0
        scienceAliasRepresentativeCount:
          type: integer
          minimum: 0
        multipleRegularAmbiguousCount:
          type: integer
          minimum: 0
        noClassAmbiguousCount:
          type: integer
          minimum: 0
        ambiguousStudentCount:
          type: integer
          minimum: 0
        insertedStudentCount:
          type: integer
          minimum: 0
        updatedStudentCount:
          type: integer
          minimum: 0
        inactivatedStudentCount:
          type: integer
          minimum: 0
        insertedAssignmentCount:
          type: integer
          minimum: 0
        updatedAssignmentCount:
          type: integer
          minimum: 0
        inactivatedAssignmentCount:
          type: integer
          minimum: 0
      additionalProperties: false

