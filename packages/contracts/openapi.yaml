    CircuitAuditEventPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          description: Strict sequence-ascending chronology.
          items:
            $ref: '#/components/schemas/CircuitAuditEvent'
        page:
          $ref: '#/components/schemas/EventPageMeta'
      additionalProperties: false

    DeviceAuditEventType:
      type: string
      enum:
        - PAIRED
        - UNPAIRED_BY_DEVICE
        - SHIFT_LOCKED
        - SHIFT_RELEASED_BY_ADMIN
        - REVOKED
