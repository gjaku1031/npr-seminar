        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/public/booking-access/session:
    post:
      operationId: exchangeBookingAccessToken
      tags: [Public family bookings]
      summary: Exchange a fragment-delivered access token and full phone for a booking-scoped read/QR session
      description: |
        The raw 256-bit access token is delivered only in the URL fragment of
        /booking/access and is submitted in this JSON body, never in a request
        path or query. The server verifies SHA-256(token) and the normalized full
        phone, regenerates the browser session, and creates a 30-minute
        booking-scoped read/QR session. This session never authorizes update or
        cancellation; those mutations require a fresh BOOKING_MANAGE proof.
        PostgreSQL stores only access-token
        and session-ID digests. Attempts are rate limited and append a secret-free
        authentication audit event. A safe idempotent replay verifies the same
        digests and establishes a fresh 30-minute browser-bound session without
        persisting or replaying the raw token or full contact.
      security: []
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-csrf: true
      x-raw-token-transport: body-only-after-url-fragment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingAccessExchangeRequest'
      responses:
        '200':
          description: Booking-scoped read/QR session established
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly booking management session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingAccessExchangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/public/family-bookings/{familyBookingId}/read-session:
    parameters:
      - $ref: '#/components/parameters/FamilyBookingId'
    post:
      operationId: establishFamilyBookingContactReadSession
      tags: [Public family bookings]
      summary: Establish a booking-scoped read/QR session after an exact contact ownership check
      description: |
        After the masked contact lookup, the client submits the selected booking
        ID and the same full parent contact. The server verifies the keyed full
        contact digest against exactly that active booking, regenerates the
        browser session, and creates a short-lived booking-scoped session. The
        lookup response itself never contains a raw QR. The new session permits
        only masked booking detail and recovery of the existing QR for this one
        booking. It never authorizes update, cancellation, or
        QR rotation; every public business mutation still requires a fresh
        BOOKING_MANAGE proof. Missing bookings, contact mismatch, cancelled
        bookings, and unavailable access credentials share the generic
        BOOKING_READ_SESSION_INVALID response.
      security: []
      x-mutation-kind: durable
      x-idempotency: required
      x-requires-csrf: true
      x-requires-same-origin: true
      x-access-session-authorization: read-and-existing-qr-only
      x-rate-limit-error-code: BOOKING_READ_SESSION_RATE_LIMITED
      x-rate-limits:
        contact: {maximum: 10, windowSeconds: 900}
        booking: {maximum: 10, windowSeconds: 900}
        ip: {maximum: 30, windowSeconds: 900}
        global: {maximum: 600, windowSeconds: 60}
      x-audit-pii-policy: fingerprints-and-owned-booking-id-only
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicFamilyBookingReadSessionRequest'
      responses:
        '200':
          description: Booking-scoped read/QR session established
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly booking-scoped session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingAccessExchangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
