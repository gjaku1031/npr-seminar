        - STUDENT_INACTIVATED
        - ASSIGNMENT_INSERTED
        - ASSIGNMENT_UPDATED
        - ASSIGNMENT_INACTIVATED
        - REPRESENTATIVE_RESOLVED
        - AMBIGUITY_DETECTED

    StudentFieldChange:
      type: object
      required: [field, before, after]
