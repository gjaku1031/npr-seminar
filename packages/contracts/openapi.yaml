      summary: Hard-delete a scanner device and its dependent runtime state
      description: |
        Idempotently hard-deletes the scanner_devices row. The foreign-key
        lifecycle deletes dependent scanner pairing audits, preserves historical
        check-in events while setting their scannerDeviceId to null, and removes
