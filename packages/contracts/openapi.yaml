    RepresentativeResolution:
      type: string
      enum: [REGULAR, SCIENCE_ALIAS, MULTIPLE_REGULAR, NO_CLASS, FUTURE_TERM_ONLY]
      description: |
        REGULAR selects exactly one regular candidate. SCIENCE_ALIAS applies when
        there are zero regular and at least one science candidate. The remaining
        values are ambiguous. FUTURE_TERM_ONLY means the student is enrolled but
        every class assignment belongs to a future term, so there is no current
        class to name; the roster shows the 비재원생 marker with no unit.

    AssignmentCandidateType:
      type: string
      enum: [REGULAR, SCIENCE, NONE]

    AssignmentExclusionReason:
      type: string
      enum: [NONE, SUPPLEMENTARY, BRACKET_EXCLUDED]

    StudentSourceAssignment:
      type: object
      description: |
        Verbatim source assignment retained for traceability. A validated
        trailing timetable suffix is retained here, but classification uses
        the suffix-stripped base class. Science is a base className starting
        with 과 or containing an explicit science subject
        token (물리, 화학, 생명과학/생물, 지구과학). Supplementary names containing
        특강, 패키지, 입시대비, or TEST case-insensitively remain here but are
        excluded from representative candidates. The subject-only assignment
        기하[시간] is also retained but excluded from representative candidates.
        Consequently 고3이과T is regular.
      x-class-name-admission:
        normalization: NFKC_TRIM_FOR_DECISION_ONLY
        accepted:
          - BRACKETLESS_WITHOUT_ASTERISK
          - ONE_TERMINAL_DISTINCT_WEEKDAY_SUFFIX_WITH_OPTIONAL_POSITIVE_1_TO_99_SLOT
          - ONE_TERMINAL_E_OR_e_SUFFIX_WITH_POSITIVE_1_TO_99_SLOT
        rejected:
          - ASTERISK
          - LEADING_MIDDLE_MULTIPLE_OR_UNCLOSED_BRACKET
          - REPEATED_WEEKDAY
          - ZERO_OR_LEADING_ZERO_SLOT
          - UNAPPROVED_LATIN_PREFIX
      required:
        - assignmentId
        - sourceAssignmentKey
        - sourceStudentNo
        - branch
        - className
        - schoolName
        - grade
        - teacherName
        - sourceStatus
        - sourceActive
        - candidateType
        - exclusionReason
        - firstSeenRunId
        - lastSeenRunId
      properties:
        assignmentId:
          type: string
          format: uuid
        sourceAssignmentKey:
          type: string
          minLength: 1
          maxLength: 300
          description: Stable source assignment identity paired with sourceStudentNo.
        sourceStudentNo:
          type: string
          minLength: 1
          maxLength: 100
        branch:
          $ref: '#/components/schemas/Branch'
        className:
          type: string
          minLength: 1
          maxLength: 200
          description: Verbatim source class name including an accepted timetable suffix; never normalized to 과학 in this field.
        schoolName:
          type: [string, 'null']
          maxLength: 200
        grade:
          type: [string, 'null']
          maxLength: 40
        teacherName:
          type: [string, 'null']
          maxLength: 100
          description: Normalized assignment teacher retained for traceability only; never interpreted as a homeroom teacher or used as a source or fallback for AdminStudent.teacherName.
          x-semantic-role: TRACEABILITY_ONLY
          x-homeroom-source: false
        sourceStatus:
          type: [string, 'null']
          maxLength: 100
        sourceActive:
          type: boolean
        candidateType:
          $ref: '#/components/schemas/AssignmentCandidateType'
        exclusionReason:
          $ref: '#/components/schemas/AssignmentExclusionReason'
        firstSeenRunId:
          type: string
          format: uuid
        lastSeenRunId:
          type: string
          format: uuid
      additionalProperties: false
      x-science-rule:
        operator: startsWithOrContainsAny
        input: suffix-stripped-base-class
        prefix: 과
        containsAny: [물리, 화학, 생명과학, 생물, 지구과학]
        normalizedRepresentativeLabel: 과학
      x-supplementary-rule:
        operator: containsAnyCaseInsensitive
        input: suffix-stripped-base-class
        values: [특강, 패키지, 입시대비, TEST]

    RepresentativeClass:
      type: object
      required:
        - resolution
        - displayName
        - ambiguous
        - regularCandidateCount
        - scienceCandidateCount
        - selectedSourceAssignmentKey
      properties:
        resolution:
          $ref: '#/components/schemas/RepresentativeResolution'
        displayName:
          description: Suffix-stripped regular base class, 과학 for SCIENCE_ALIAS, or null when ambiguous.
          type: [string, 'null']
          maxLength: 200
        ambiguous:
          type: boolean
        regularCandidateCount:
          type: integer
          minimum: 0
        scienceCandidateCount:
          type: integer
          minimum: 0
        selectedSourceAssignmentKey:
          description: Present only for REGULAR; science may comprise multiple preserved source assignments.
          type: [string, 'null']
          maxLength: 300
      additionalProperties: false

    PublicStudent:
      type: object
      required:
