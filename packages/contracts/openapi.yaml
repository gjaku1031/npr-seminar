  /api/v1/admin/seminar-sessions/{sessionId}/roster:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getAdminSessionRoster
      tags: [Admin family bookings]
      summary: List the reservation participants for one seminar session
      description: |
        ADMIN-only read model containing only enrolled students linked to a booking
        for the selected session plus that session's deduplicated guest booking
        intents. Unbooked canonical students are not roster participants. Siblings
        remain separate student rows and repeat the same familyBookingId projection.
        Reserved, checked-in, cancelled, and no-show participants remain visible;
        an active aggregate wins, otherwise the latest terminal aggregate is projected.
        QR lifecycle events are excluded from latestOperationalEvent.
        Guest cancellation followed by rebooking is folded into one roster intent
        using contact digest + NFKC-normalized case-folded name + branch. The
        active aggregate wins and all aggregate histories remain addressable.
        Full parent contacts are sensitive response fields and are never exposed
        by public booking or student schemas. Results are sorted before pagination
        by campus CAMPUS_A, CAMPUS_B, CAMPUS_C; unit group elementary, middle 1,
        middle 2, middle 3, special purpose, high, science, guest; then the active
        math class when present, otherwise the first active science class for a
        science-only student, then participant name and source student number.
        The generic students.class_name alias is never the science-only sort key.
        Unmatched enrolled units follow those groups. monitoring uses the complete
        filtered result before pagination, but only RESERVED and CHECKED_IN
        participation contributes: studentCount is the active participant identity
        count, familyBookingCount removes active sibling duplicates, and
        attendeeCount sums those active parent attendees.
      security:
        - cookieAuth: []
      x-required-roles: [ADMIN]
      x-monitoring-statuses: [RESERVED, CHECKED_IN]
      parameters:
        - $ref: '#/components/parameters/BranchQuery'
        - name: unitGroup
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RosterUnitGroup'
        - name: teacherName
          in: query
          required: false
          description: Exact canonical math-homeroom teacher (the first trimmed comma-separated student-row value). Science-only and other no-math rows never match.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: query
          in: query
          required: false
          description: Student name, school, source number, or exact contact last four.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Reservation participant page and branch-scoped booking-participant teacher facets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRosterPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
